    id: birdseye_page
    scrollable: false
    width: 100%
    height: 100%
    bg_color: 0xFF181818
    pad_all: 0
    layout:
      type: flex
      flex_flow: column

    widgets:
      - obj:
          align: CENTER
          bg_opa: 0
          border_width: 0
          pad_all: 0
          width: 100%
          height: SIZE_CONTENT
          layout:
            type: flex
            flex_flow: column
            flex_align_main: center
            flex_align_cross: center
          widgets:
            - label:
                text: "Tap the camera image to return home"
                #text_font: MONTSERRAT_12
                text_color: 0xFFFFFF
                pad_bottom: 6

            - image:
                id: w_cam_birdseye_full             
                height: 360
                width: 640 #IZE_CONTENT
                src: online_img_birdseye
                on_click:
                  - lvgl.page.show: main_page

      - !include
          file: ../addon/nav_bar.yaml
          vars:
            active_page: '"birdseye"'  # Must be one of: "home", "lighting", "button3", "button4"
            page_title: 'BIRDSEYE' # The title to display
            nav_bar_id: nav_bar_birdseye  # unique per page