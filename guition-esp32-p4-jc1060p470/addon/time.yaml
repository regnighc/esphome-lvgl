# SNTP clock. Updates the Home clock, the date, and the small clock in the nav rail.
time:
  - platform: sntp
    id: sntp_time
    timezone: "GMT0BST,M3.5.0/1,M10.5.0"
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time_sync:
      then:
        - script.execute: clock_refresh
    on_time:
      - seconds: 0
        then:
          - script.execute: clock_refresh

script:
  - id: clock_refresh
    then:
      - if:
          condition:
            lambda: 'return id(sntp_time).now().is_valid();'
          then:
            - lvgl.label.update:
                id: [main_time, rail_time]
                text: !lambda 'return id(sntp_time).now().strftime("%H:%M");'
            - lvgl.label.update:
                id: main_date
                text: !lambda 'return id(sntp_time).now().strftime("%A %d %B");'
            - text_sensor.template.publish:
                id: web_time
                state: !lambda 'return id(sntp_time).now().strftime("%H:%M");'
