# SNTP Time (standalone clock source)
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/London
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time:
      - minutes: '*'
        seconds: 0
        then:
          # Re-render the LVGL clock label every minute
          - lvgl.widget.refresh: main_clock