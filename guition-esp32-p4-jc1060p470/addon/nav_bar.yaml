# This is a reusable navigation bar widget.
#
# To use it in a page, include it in the widgets list like this:
#
# - !include
#     file: ../addon/nav_bar.yaml
#     vars:
#       active_page: '"home"'  # Must be one of: "home", "lighting", "button3", "button4"
#       page_title: '"YOUR PAGE TITLE"' # The title to display
#
- obj:
    width: 100%
    height: 85
    scrollable: false
    bg_color: 0x1A1A1A
    border_width: 1
    border_side: TOP
    pad_top: 10
    pad_bottom: 0
    pad_left: 0
    pad_right: 0
    border_color: 0x333333
    layout:
      type: flex
      flex_flow: row
      flex_align_main: space_evenly
      flex_align_cross: center
    widgets:
      # Home Button
      - button:
          width: 120
          height: 70
          bg_color: !lambda 'return (strcmp(active_page, "home") == 0) ? 0x2196F3 : 0x2A2A2A;'
          on_click:
            - lvgl.page.show: main_page # Assumes your home page is named 'main_dashboard_page'. Change if needed.
          widgets:
            - label:
                text: "HOME"
                align: center
                text_color: 0xFFFFFF

      # Lighting Button
      - button:
          width: 120
          height: 70
          bg_color: !lambda 'return (strcmp(active_page, "lighting") == 0) ? 0x2196F3 : 0x2A2A2A;'
          on_click:
            - lvgl.page.show: lighting_page
          widgets:
            - label:
                text: "Lighting"
                align: center
                text_color: 0xFFFFFF

      # Page Title
      - label:
          text: !lambda 'return page_title;'
          width: 300
          text_align: center
          text_color: 0xFFFFFF

      # Button 3
      - button:
          width: 120
          height: 70
          bg_color: !lambda 'return (strcmp(active_page, "birdseye") == 0) ? 0x2196F3 : 0x2A2A2A;'
          on_click:
            - lvgl.page.show: birdseye_page
          widgets:
            - label:
                text: "Birdseye"
                align: center
                text_color: 0xFFFFFF
      # Button 4
      - button:
          width: 120
          height: 70
          bg_color: !lambda 'return (strcmp(active_page, "place1") == 0) ? 0x2196F3 : 0x2A2A2A;'
          on_click:
            - lvgl.page.show: placeholder_page_1
          widgets:
            - label:
                text: "Placeholder"
                align: center
                text_color: 0xFFFFFF
