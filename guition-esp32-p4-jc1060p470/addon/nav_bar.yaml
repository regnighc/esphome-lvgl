# This is a reusable navigation bar widget.
#
# To use it in a page, include it in the widgets list like this:
#
# - !include
#     file: ../addon/nav_bar.yaml
#     vars:
#       active_page: home  # Must be one of: home, lighting, birdseye, place1
#       page_title: YOUR PAGE TITLE
#
obj:
  id: ${nav_bar_id}
  width: 100%
  height: 85
  scrollable: false
  bg_color: 0xFF1C1E26
  border_width: 0
  border_side: TOP
  pad_top: 10
  pad_bottom: 0
  pad_left: 0
  pad_right: 0
  #border_color: 0x333333
  layout:
    type: flex
    flex_flow: row
    flex_align_main: space_evenly
    flex_align_cross: center
  widgets:
    - button:
        width: 120
        height: 70
        bg_color: !lambda 'return (strcmp(${active_page}, "home") == 0) ? lv_color_hex(0x2196F3) : lv_color_hex(0x2A2A2A);'
        on_click:
          - lvgl.page.show: main_page
        widgets:
          - label:
              text: "HOME"
              align: center
              text_color: 0xFFFFFF

    - button:
        width: 120
        height: 70
        bg_color: !lambda 'return (strcmp(${active_page}, "lighting") == 0) ? lv_color_hex(0x2196F3) : lv_color_hex(0x2A2A2A);'
        on_click:
          - lvgl.page.show: lighting_page
        widgets:
          - label:
              text: "Lighting"
              align: center
              text_color: 0xFFFFFF

    - label:
        text: "${page_title}"
        width: 300
        text_align: center
        text_color: 0xFFFFFF

    - button:
        width: 120
        height: 70
        bg_color: !lambda 'return (strcmp(${active_page}, "birdseye") == 0) ? lv_color_hex(0x2196F3) : lv_color_hex(0x2A2A2A);'
        on_click:
          - lvgl.page.show: birdseye_page
        widgets:
          - label:
              text: "Birdseye"
              align: center
              text_color: 0xFFFFFF

    - button:
        width: 120
        height: 70
        bg_color: !lambda 'return (strcmp(${active_page}, "place1") == 0) ? lv_color_hex(0x2196F3) : lv_color_hex(0x2A2A2A);'
        on_click:
          - lvgl.page.show: placeholder_page_1
        widgets:
          - label:
              text: "Placeholder"
              align: center
              text_color: 0xFFFFFF