      then:
        - lvgl.image.update:
            id: w_cam_2
            src: online_img_cam_2
        - lvgl.image.update:
            id: w_cam_2_full
            src: online_img_cam_2

  - url: "http://192.168.2.127:5566/api/B2C4/person/snapshot.jpg"
    id: online_img_cam_1
    type: RGB565
    byte_order: little_endian
    format: jpeg
    #placeholder: album_art_placeholder
    update_interval: 10min
    buffer_size: 131072
    on_download_finished:
      then:
        - lvgl.image.update:
            id: w_cam_1
            src: online_img_cam_1
        - lvgl.image.update:
            id: w_cam_1_full
            src: online_img_cam_1
    on_error:
      then:
        - lvgl.image.update:
            id: w_cam_1
            src: online_img_cam_1
        - lvgl.image.update:
            id: w_cam_1_full
            src: online_img_cam_1

  - url: "http://192.168.2.127:5566/api/birdseye/latest.jpg?height=360"
