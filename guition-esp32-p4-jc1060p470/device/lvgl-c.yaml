                                    radius: 12
                                    indicator: {bg_color: 0xE5CA3E, radius: 12}
                                    knob: {bg_opa: TRANSP}
                                    on_release:
                                      - homeassistant.service:
                                          service: light.turn_on
                                          data:
                                            entity_id: light.placeholder_1
                                          data_template:
                                            brightness: "{{ slider_val }}"
                                          variables:
                                            slider_val: !lambda "return (int)x;"
                                - slider:
                                    id: light_col1_1_colortemp
                                    width: 46%
                                    height: 110
                                    min_value: 153
                                    max_value: 500
                                    bg_color: 0xFF6B6B6B
                                    radius: 12
