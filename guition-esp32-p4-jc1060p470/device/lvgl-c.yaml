    # =========================================================================
    # PAGE: LIGHTING
    # Two equal columns. Each column has 4 dual-slider containers.
    # Each container: brightness slider (left half) + colour_temp slider (right half).
    # Container auto-fits column width; sliders each take ~50% of container width.
    # =========================================================================
    - id: lighting_page
      scrollable: false
      width: 100%
      height: 100%
      bg_color: 0xFF181818
      pad_all: 0
      layout:
        type: flex
        flex_flow: column

      widgets:
        - obj:
            id: lighting_content_area
            width: 100%
            flex_grow: 1
            scrollable: false
            bg_opa: TRANSP
            border_width: 0
            pad_all: 8
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_between
              flex_align_cross: start

            widgets:

              # ---------------------------------------------------------------
              # LIGHTING COLUMN 1
              # Column width = (1024 - 16pad - 8gap) / 2 = 500px
              # Container width = 100% of column = 500px
              # Each slider = ~50% of inner width (500 - 16pad) / 2 = 242px
              # ---------------------------------------------------------------
              - obj:
                  width: 500
                  height: 100%
                  scrollable: false
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_cross: center
                    pad_row: 10
                  widgets:

                    # Light Container 1
                    - obj: &dual_slider_container
                        width: 100%
                        height: 160
                        scrollable: false
                        bg_color: 0xFF2A2D2E
                        radius: 15
                        border_width: 0
                        pad_all: 8
                        layout:
                          type: flex
                          flex_flow: column
                          flex_align_cross: center
                          flex_align_main: center
                          pad_column: 8
                        widgets:
                          - obj:
                              width: 100%
                              height: 120
                              scrollable: false
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              layout:
