              - label:
                  text: "Time"
                  text_font: MONTSERRAT_12
                  text_color: 0xFF888888
                  width: 100%
              - label:
                  id: lbl_b2c4_last_person_detection
                  text: "00:00"
                  text_font: MONTSERRAT_14
                  text_color: 0xFFFFFFFF
                  width: 100%
              - label:
                  text: "Time since detection"
                  text_font: MONTSERRAT_12
                  text_color: 0xFF888888
                  width: 100%
              - label:
                  id: lbl_b2c4_last_person_detection_ago
                  text: "00:00"
                  text_font: MONTSERRAT_14
                  text_color: 0xFFFFFFFF
                  width: 100%

    - id: cam2_full_page
