################################################################################
# Colours
################################################################################
color:
  - id: lcars_beige
    hex: "E6CC99"
  - id: lcars_blue_gray
    hex: "99B3CC"
  - id: black
    hex: "000000"
  - id: lcars_white
    hex: "FFFFFF"
  - id: lcars_orange
    hex: "ff8800"
  - id: lcars_lightblue
    hex: "6c7acc"
  - id: lcars_red
    hex: "eb4e4e"
  - id: lcars_lightorange
    hex: "ff9c00"
  - id: lcars_lavender
    hex: "cc99ff"

# LVGL User Interface Paradigm
lvgl:
  id: my_lvgl
  color_depth: 16
  buffer_size: 100%
  byte_order: little_endian
  on_idle:
    timeout: 120s
    then:
      - switch.turn_off: backlight
  on_touch:
    then:
      - switch.turn_on: backlight
  displays:
    - my_display
  touchscreens:
    - my_touchscreen

  pages:
    # =============================================================
    # ROOT PAGE: MAIN DASHBOARD
    # =============================================================
    - id: main_page
      scrollable: false
      layout:
        type: flex
        flex_flow: column
      width: 100%
      height: 100%
      bg_color: 0xFF0F1015
      pad_all: 0

      widgets:
        # ---------------------------------------------------------
        # ZONE 1: MAIN CONTENT AREA (3 equal columns)
        # Screen is 1024px wide. pad_all: 8 on each side = 16px total.
        # 3 columns with 8px gaps between them:
        #   available = 1024 - 16 - 16 = 992px
        #   each col  = (992 - 8 - 8) / 3 = 325px  (≈ 325)
        # Nav bar is 80px; content height = 100% - 80px (via flex_grow: 1)
        # ---------------------------------------------------------
        - obj:
            id: main_content_area
            width: 100%
            flex_grow: 1
            scrollable: false
            bg_opa: TRANSP
            border_width: 0
            pad_all: 8
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_between
              flex_align_cross: start
            widgets:

              # ═══════════════════════════════════════════════════
              # COLUMN 1: Clock + Date → Divider → Slider 1 + 2
              # ═══════════════════════════════════════════════════
              - obj:
                  width: 325
                  height: 100%
                  scrollable: false
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_cross: center
                    pad_row: 10
                  widgets:

                    # --- Clock block ---
                    - obj:
                        id: clock_time
                        width: 100%
                        height: 146 #height: SIZE_CONTENT
                        scrollable: false
                        bg_opa: TRANSP
                        border_width: 0
                        layout:
                          type: flex
                          flex_flow: column
                          flex_align_main: center
                          flex_align_cross: center
                          pad_row: 0
                        widgets:
                          - label:
                              id: main_time
                              width: 100%
                              height: 95
                              pad_all: 0
                              text_align: center
                              text_font: time_font
                              text_color: 0xFFFFFF
                              #text: !lambda 'auto now = id(sntp_time).now(); return now.is_valid() ? now.strftime("%H:%M").c_str() : "Syncing...";'
                              text: "--:--"
                          - label:
                              id: main_date
                              width: 100%
                              height: 25
                              pad_all: 0
                              text_align: center
                              text_font: date_font
                              text_color: 0xFF3E4254
                              #text: !lambda 'auto now = id(sntp_time).now(); return now.is_valid() ? now.strftime("%a, %b %d").c_str() : "Please wait";'
                              text: "Loading date..."

                    # --- Divider ---
                    - line:
                        width: 305
                        height: 2
                        points: [ {x: 0, y: 0}, {x: 305, y: 0} ]
                        line_width: 3
                        line_color: 0xFF3E4254

                    # --- Spacer ---
                    - obj:
                        width: 1
                        height: 4
                        bg_opa: TRANSP
                        border_width: 0

                    # --- Slider 1: Hallway Lights ---
                    - obj: &slider_box_style
                        width: 305
                        height: 150
                        scrollable: false
                        bg_color: 0xFF1C1E26
                        radius: 15
                        border_width: 0
                        layout:
                          type: flex
                          flex_flow: column
                          flex_align_cross: center
                          pad_row: 8
                          #pad_all: 8
                        widgets:
                          - slider:
                              id: hallway_brightness_slider
                              min_value: 0
                              max_value: 255  
                              width: 100%
                              height: 110
                              bg_color: 0xFF6B6B6B
                              radius: 12
                              indicator: {bg_color: 0xE5CA3E, radius: 12}
                              knob: {bg_opa: TRANSP}
                              on_release:
                                - homeassistant.service:
                                    service: light.turn_on
                                    data:
                                      entity_id: light.hallway_overhead_group
                                      color_temp: "370"
                                    data_template:
                                      brightness: "{{ slider_val }}"
                                    variables:
                                      slider_val: !lambda "return (int)x;"
                          - label:
                              width: 100%
                              text_align: center
                              text: "HALLWAY LIGHTS"
                              text_color: 0xFF3E4254

                    # --- Hallway Lamp Button ---
                    - obj:
                        <<: *slider_box_style
                        widgets:
                          - button:
                              id: hallway_accent_slider
                              width: 100%
                              height: 110
                              bg_color: 0xFF6B6B6B
                              bg_opa: COVER
                              radius: 12
                              #indicator: {bg_color: 0xE5CA3E, radius: 12}
                              #knob: {bg_opa: TRANSP}
                              on_release:
                                - homeassistant.service:
                                    service: switch.toggle
                                    data:
                                      entity_id: switch.hall_lamp
                          - label:
                              width: 100%
                              text_align: center
                              text: "HALLWAY LAMP"
                              text_color: 0xFF3E4254

              # ═══════════════════════════════════════════════════
              # COLUMN 2: Weather → Divider → Slider 3 + 4
              # ═══════════════════════════════════════════════════
              - obj:
                  width: 325
                  height: 100%
                  scrollable: false
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_cross: center
                    pad_row: 10
                  widgets:
                    - obj:
                        width: 100%
                        height: 146
                        scrollable: false
                        bg_opa: TRANSP
                        border_width: 0
                        layout:
                          type: flex
                          flex_flow: column
                          flex_align_main: center
                          flex_align_cross: center
                          pad_row: 0
                        widgets:
                          - obj:
                              id: weather_row_1     
                              width: 100%
                              height: SIZE_CONTENT
                              scrollable: false
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              layout:
                                type: flex
                                flex_flow: row
                                flex_align_main: center
                                flex_align_cross: center
                                pad_column: 0
                              widgets:
                                - label:
                                    id: weather_row_1_label_1
                                    width: 50%
                                    height: SIZE_CONTENT
                                    pad_all: 0
                                    text_align: center
                                    text_font: high_temp_font
                                    text_color: 0xFFFFFF
                                    # text: !lambda 'auto now = id(sntp_time).now(); return now.is_valid() ? now.strftime("%H:%M").c_str() : "Syncing...";'
                                    text: "--°C"
                                    align: CENTER # <--- ADDITIONAL: Forces alignment relative to parent
                                - label:
                                    id: weather_row_1_label_2
                                    width: 50%
                                    height: SIZE_CONTENT
                                    pad_all: 0
                                    text_align: center
                                    align: CENTER # <--- ADDITIONAL: Forces alignment relative to parent
                                    text_font: icon_font
                                    text_color: 0xFFFFFF
                                    # text: !lambda 'auto now = id(sntp_time).now(); return now.is_valid() ? now.strftime("%H:%M").c_str() : "Syncing...";'
                                    text: "${weather_sunny}"

                          - obj:
                              id: weather_row_2    
                              width: 100%
                              height: SIZE_CONTENT
                              scrollable: false
                              bg_opa: TRANSP
                              border_width: 0
                              layout:
                                type: flex
                                flex_flow: row
                                flex_align_main: center
                                flex_align_cross: center
                                pad_column: 0
                              widgets:
                                - label:
                                    id: weather_row_2_label_1
                                    width: 50%
                                    height: SIZE_CONTENT
                                    pad_all: 0
                                    text_align: center
                                    text_font: date_font
                                    text_color: 0xFF3E4254 #0xFF2196F3
                                    # text: !lambda 'auto now = id(sntp_time).now(); return now.is_valid() ? now.strftime("%a, %b %d").c_str() : "Please wait";'
                                    text: "--°C"
                                - label:
                                    id: weather_row_2_label_2
                                    width: 50%
                                    height: SIZE_CONTENT
                                    pad_all: 0
                                    text_align: center
                                    text_font: date_font
                                    text_color: 0xFF3E4254 #0xFFFFFF
                                    # text: !lambda 'auto now = id(sntp_time).now(); return now.is_valid() ? now.strftime("%a, %b %d").c_str() : "Please wait";'
                                    text: "Sunny"

                    # --- Divider (aligned with col 1) ---
                    - line:
                        width: 305
                        height: 2
                        points: [ {x: 0, y: 0}, {x: 305, y: 0} ]
                        line_width: 3
                        line_color: 0xFF3E4254

                    # --- Spacer ---
                    - obj:
                        width: 1
                        height: 4
                        bg_opa: TRANSP
                        border_width: 0

                    # --- Climate Panel ---
                    - obj:
                        <<: *slider_box_style
                        id: climate_panel
                        height: 308
                        layout:
                          type: flex
                          flex_flow: column
                          flex_align_main: space_evenly
                          flex_align_cross: center
                          pad_row: 0
                        overflow_visible: false
                        widgets:
                          # --- Target Temperature ---
                          - label:
                              id: lbl_target_temp
                              text: "--°C"
                              text_font: climate_font
                              text_color: 0xFFFFFFFF
                              width: 100%
                              text_align: center

                          # --- Spacer ---
                          - obj:
                              width: 2
                              height: 5
                              bg_opa: TRANSP
                              border_width: 0

                          # --- Current Temperature ---
                          - label:
                              id: lbl_current_temp
                              text: "--°C"
                              text_font: MONTSERRAT_16
                              text_color: 0xFF3E4254 #0xFF2196F3
                              width: 100%
                              text_align: center

                          # --- Spacer ---
                          - obj:
                              width: 2
                              height: 8
                              bg_opa: TRANSP
                              border_width: 0
                          # --- Mode and Boost Row ---
                          - obj:
                              width: 100%
                              height: SIZE_CONTENT
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 3
                              layout:
                                type: flex
                                flex_flow: row
                                flex_align_main: center
                                flex_align_cross: center
                                pad_column: 8
                              widgets:
                                - dropdown:
                                    id: hvac_mode_dropdown
                                    width: 120
                                    options:
                                      - "auto"
                                      - "heat"
                                      - "off"
                                    on_value:
                                      then:
                                        - homeassistant.service:
                                            service: climate.set_hvac_mode
                                            data:
                                              entity_id: climate.thermostat
                                            data_template:
                                              hvac_mode: "{{ mode }}"
                                            variables:
                                              mode: !lambda |
                                                if (x == 0) return std::string("auto");
                                                if (x == 1) return std::string("heat");
                                                return std::string("off");

                                - button:
                                    id: btn_boost
                                    width: 80
                                    height: 36
                                    bg_color: 0xFF3F51A6 #
                                    radius: 8
                                    on_click:
                                      then:
                                        - homeassistant.service:
                                            service: climate.set_preset_mode
                                            data:
                                              entity_id: climate.thermostat
                                              preset_mode: boost
                                    widgets:
                                      - label:
                                          text: "BOOST"
                                          align: center
                                          text_color: 0xFFFFFFFF
                                          text_font: MONTSERRAT_12

                          # --- Spacer ---
                          - obj:
                              width: 100%
                              height: 20
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0

                          # --- Action + +/- Row ---
                          - obj:
                              width: 100%
                              height: SIZE_CONTENT
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 3
                              layout:
                                type: flex
                                flex_flow: row
                                flex_align_main: center
                                flex_align_cross: center
                                pad_column: 20
                              widgets:
                                - button:
                                    width: 66
                                    height: 66
                                    radius: 33
                                    bg_color: 0xFF6B6B6B
                                    on_click:
                                      then:
                                        - homeassistant.service:
                                            service: climate.set_temperature
                                            data:
                                              entity_id: climate.thermostat
                                            data_template:
                                              temperature: "{{ current_temp }}"
                                            variables:
                                              current_temp: !lambda "return id(target_temp_val) - 0.5f;"
                                    widgets:
                                      - label:
                                          text: "-"
                                          align: center
                                          text_font: MONTSERRAT_36
                                          text_color: 0xFFFFFFFF

                                - label:
                                    id: lbl_hvac_action
                                    text: "Idle"
                                    text_font: MONTSERRAT_18
                                    text_color: 0xFF3E4254

                                - button:
                                    width: 66
                                    height: 66
                                    radius: 33
                                    bg_color: 0xFF6B6B6B
                                    on_click:
                                      then:
                                        - homeassistant.service:
                                            service: climate.set_temperature
                                            data:
                                              entity_id: climate.thermostat
                                            data_template:
                                              temperature: "{{ current_temp }}"
                                            variables:
                                              current_temp: !lambda "return id(target_temp_val) + 0.5f;"
                                    widgets:
                                      - label:
                                          text: "+"
                                          align: center
                                          text_font: MONTSERRAT_24
                                          text_color: 0xFFFFFFFF
                          # --- Spacer ---
                          - obj:
                              width: 2
                              height: 28
                              bg_opa: TRANSP
                              border_width: 0
                          # --- Panel Title ---
                          - label:
                              width: 100%
                              text_align: center
                              text: "CLIMATE CONTROL"
                              text_color: 0xFF3E4254


              # ═══════════════════════════════════════════════════
              # COLUMN 3: Camera images stacked
              # ═══════════════════════════════════════════════════
              - obj:
                  width: 325
                  height: 100%
                  scrollable: false
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_cross: center
                    flex_align_main: start
                    pad_row: 10
                  widgets:
                    - image:
                        align: CENTER
                        id: w_cam_1
                        width: 320
                        height: 240
                        src: online_img_cam_1
                        radius: 15
                        clip_corner: true
                        zoom: 0.55
                        mode: REAL
                        on_click:
                          - lvgl.page.show: cam1_full_page
                    - image:
                        align: CENTER
                        id: w_cam_2
                        width: 320
                        height: 240
                        src: online_img_cam_2
                        radius: 15
                        clip_corner: true
                        zoom: 0.55
                        mode: REAL
                        on_click:
                          - lvgl.page.show: cam2_full_page

        # ---------------------------------------------------------
        # ZONE 2: FIXED BOTTOM NAVIGATION BAR
        # ---------------------------------------------------------
        - !include
            file: ../addon/nav_bar.yaml
            vars:
              active_page: '"home"'  # Must be one of: "home", "lighting", "button3", "button4"
              page_title: 'MAIN DASHBOARD' # The title to display
              nav_bar_id: nav_bar_home  # unique per page

    # =============================================================
    # SECONDARY PAGE: TEST ENVIRONMENT
    # =============================================================
    - id: test_page
      layout:
        type: flex
        flex_flow: column
      width: 100%
      height: 100%
      bg_color: 0x101010
      pad_all: 0

      widgets:
        - obj:
            id: test_content_area
            width: 100%
            flex_grow: 1
            scrollable: false
            bg_opa: TRANSP
            border_width: 0
            layout:
              type: flex
              flex_flow: column
              flex_align_main: center
              flex_align_cross: center
            widgets:
              - label:
                  text: "Test Bed Experiments"
                  text_color: 0x00FF00
                  text_font: label_font

        - obj:
            id: nav_bar_test
            width: 100%
            height: 80
            scrollable: false
            bg_color: 0xFF1C1E26
            border_width: 1
            border_side: TOP
            pad_top: 10
            pad_bottom: 0
            pad_left: 0
            pad_right: 0
            border_color: 0x333333
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_evenly
              flex_align_cross: center
            widgets:
              # Route Back to Main Page
              - button:
                  width: 120
                  height: 60
                  bg_color: 0x2A2A2A
                  on_click:
                    - lvgl.page.show: main_page
                  widgets:
                    - label:
                        text: "HOME"
                        align: center
                        text_color: 0xFFFFFF

              - label:
                  text: "TEST ENVIRONMENT"
                  width: 300
                  text_align: center
                  text_color: 0xFFFFFF

              # Active Navigation Button
              - button:
                  width: 120
                  height: 60
                  bg_color: 0x2196F3
                  widgets:
                    - label:
                        text: "TEST"
                        align: center
                        text_color: 0xFFFFFF
    - id: cam1_full_page
      scrollable: false
      width: 100%
      height: 100%
      bg_color: 0xFF000000
      pad_all: 0
      layout:
        type: flex
        flex_flow: row
        flex_align_main: start
        flex_align_cross: center
      widgets:
        - obj:
            align: CENTER
            bg_opa: 0
            border_width: 0
            pad_all: 0
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            layout:
              type: flex
              flex_flow: column
              flex_align_main: center
              flex_align_cross: center
            widgets:
              - label:
                  text: "Tap the camera image to return home"
                  #text_font: MONTSERRAT_12
                  text_color: 0xFFFFFF
                  pad_bottom: 6

              - image:
                  id: w_cam_1_full
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  src: online_img_cam_1
                  on_click:
                    - lvgl.page.show: main_page

        - obj:
            scrollable: false
            bg_color: 0xFF1C1E26
            radius: 15
            flex_grow: 1
            height: 90%
            pad_all: 10
            layout:
              type: flex
              flex_flow: column
              flex_align_main: start
              flex_align_cross: center
            widgets:
              - label:
                  text: "Last Detection"
                  text_font: MONTSERRAT_16
                  text_color: 0xFFFFFFFF
                  width: 100%
              - obj:
                  height: 1
                  width: 98%
                  bg_color: 0xFF555555
                  pad_all: 0
                  border_width: 0
              - label:
                  text: "Object"
                  text_font: MONTSERRAT_12
                  text_color: 0xFF888888
                  width: 100%
              - label:
                  text: "Person"
                  text_font: MONTSERRAT_14
                  text_color: 0xFFFFFFFF
                  width: 100%
              - label:
                  text: "Camera"
                  text_font: MONTSERRAT_12
                  text_color: 0xFF888888
                  width: 100%
              - label:
                  text: "Flat Door"
                  text_font: MONTSERRAT_14
                  text_color: 0xFFFFFFFF
                  width: 100%
              - label:
                  text: "Time"
                  text_font: MONTSERRAT_12
                  text_color: 0xFF888888
                  width: 100%
              - label:
                  id: lbl_b2c4_last_person_detection
                  text: "00:00"
                  text_font: MONTSERRAT_14
                  text_color: 0xFFFFFFFF
                  width: 100%
              - label:
                  text: "Time since detection"
                  text_font: MONTSERRAT_12
                  text_color: 0xFF888888
                  width: 100%
              - label:
                  id: lbl_b2c4_last_person_detection_ago
                  text: "00:00"
                  text_font: MONTSERRAT_14
                  text_color: 0xFFFFFFFF
                  width: 100%

    - id: cam2_full_page
      scrollable: false
      width: 100%
      height: 100%
      bg_color: 0xFF000000
      pad_all: 0
      layout:
        type: flex
        flex_flow: row
        flex_align_main: start
        flex_align_cross: center
      widgets:
        - obj:
            align: CENTER
            bg_opa: 0
            border_width: 0
            pad_all: 0
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            layout:
              type: flex
              flex_flow: column
              flex_align_main: center
              flex_align_cross: center
            widgets:
              - label:
                  text: "Tap the camera image to return home"
                  #text_font: MONTSERRAT_12
                  text_color: 0xFFFFFF
                  pad_bottom: 6

              - image:
                  id: w_cam_2_full
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  src: online_img_cam_2
                  on_click:
                    - lvgl.page.show: main_page
        - obj:
            scrollable: false
            bg_color: 0x444444
            radius: 15
            flex_grow: 1
            height: 90%
            pad_all: 10
            layout:
              type: flex
              flex_flow: column
              flex_align_main: start
              flex_align_cross: center
            widgets:
              - label:
                  text: "Last Detection"
                  text_font: MONTSERRAT_16
                  text_color: 0xFFFFFFFF
                  width: 100%
              - obj:
                  height: 1
                  width: 98%
                  bg_color: 0xFF555555
                  pad_all: 0
                  border_width: 0
              - label:
                  text: "Object"
                  text_font: MONTSERRAT_12
                  text_color: 0xFF888888
                  width: 100%
