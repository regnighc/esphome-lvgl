              - label:
                  text: "Object"
                  text_font: MONTSERRAT_12
                  text_color: 0xFF888888
                  width: 100%
              - label:
                  text: "Person"
                  text_font: MONTSERRAT_14
                  text_color: 0xFFFFFFFF
                  width: 100%
              - label:
                  text: "Camera"
                  text_font: MONTSERRAT_12
                  text_color: 0xFF888888
                  width: 100%
              - label:
                  text: "Main Entrance Door"
                  text_font: MONTSERRAT_14
                  text_color: 0xFFFFFFFF
                  width: 100%
              - label:
                  text: "Time"
                  text_font: MONTSERRAT_12
