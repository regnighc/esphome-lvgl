        #           bg_color: 0x2A2A2A
        #           on_click:
        #             - lvgl.page.show: lighting_page #test_page
        #           widgets:
        #             - label:
        #                 text: "Lighting"
        #                 align: center
        #                 text_color: 0xFFFFFF
                        

        #       # Page Title
        #       - label:
        #           text: "MAIN DASHBOARD"
        #           width: 300
        #           text_align: center
        #           text_color: 0xFFFFFF

        #       - button:
        #           width: 120
