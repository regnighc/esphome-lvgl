              #     # 1. THE "HOLE" BASE (Sunken Effect)
              #     # To create depth "into" the screen (like image_0.png), we apply 
              #     # a gradient from very dark desaturated red at the top to 
              #     # desaturated pinkish red at the bottom. This simulates an overhead 
