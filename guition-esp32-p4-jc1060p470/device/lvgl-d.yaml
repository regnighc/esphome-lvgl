    # ==========================================================================
    # CAMERAS
    # ==========================================================================
    - id: cameras_page
      scrollable: false
      bg_opa: COVER
      bg_color: 0x0D0F13
      pad_all: 0
      text_color: 0xF1F3F6
      on_load:
        - lvgl.widget.update: {id: nav_cameras, state: {checked: true}}
        - lvgl.widget.update: {id: [nav_home, nav_lights], state: {checked: false}}
        - lvgl.widget.show: rail_time
        - component.update: online_img_birdseye
      widgets:
        # ---- Large view (fits 16:9 or 4:3 inside 640 x 360) ----
        - obj:
            x: 112
            y: 16
            width: 640
            height: 360
            radius: 16
            bg_opa: COVER
            bg_color: 0x1A1D24
            clip_corner: true
            scrollable: false
            widgets:
              - image:
                  id: w_cam_view
                  align: CENTER
                  src: online_img_birdseye

        # ---- Last person, one tile per door (tap = show that camera) ----
        - obj:
            x: 112
            y: 388
            width: 312
            height: 196
            styles: st_card
            scrollable: false
            clickable: true
            on_click:
              - script.execute:
                  id: select_cam
                  cam: 0
            widgets:
              - label: {x: 16, y: 16, styles: st_muted, text: "Main entrance · last person"}
              - label: {id: cam_entrance_time, x: 16, y: 56, text_font: roboto_22, text: "--"}
              - label: {id: cam_entrance_ago, x: 16, y: 96, styles: st_muted, text: "--"}
        - obj:
            x: 440
            y: 388
            width: 312
            height: 196
            styles: st_card
            scrollable: false
            clickable: true
            on_click:
              - script.execute:
                  id: select_cam
                  cam: 1
            widgets:
              - label: {x: 16, y: 16, styles: st_muted, text: "Flat door · last person"}
              - label: {id: cam_flat_time, x: 16, y: 56, text_font: roboto_22, text: "--"}
              - label: {id: cam_flat_ago, x: 16, y: 96, styles: st_muted, text: "--"}

        # ---- Selector ----
        - button:
            id: cam_btn_entrance
            x: 768
            y: 16
            width: 240
            height: 84
            bg_color: 0x1A1D24
            state:
              checked: true
            checked: {bg_color: 0x24324A, text_color: 0x8DB8FF, border_width: 3, border_color: 0x5B9BFF}
            on_click:
              - script.execute:
                  id: select_cam
                  cam: 0
            widgets:
              - label: {align: LEFT_MID, x: 18, text_font: roboto_22, text: "Main entrance"}
        - button:
            id: cam_btn_flat
            x: 768
            y: 112
            width: 240
            height: 84
            bg_color: 0x1A1D24
            checked: {bg_color: 0x24324A, text_color: 0x8DB8FF, border_width: 3, border_color: 0x5B9BFF}
            on_click:
              - script.execute:
                  id: select_cam
                  cam: 1
            widgets:
              - label: {align: LEFT_MID, x: 18, text_font: roboto_22, text: "Flat door"}
        - button:
            id: cam_btn_birdseye
            x: 768
            y: 208
            width: 240
            height: 84
            bg_color: 0x1A1D24
            checked: {bg_color: 0x24324A, text_color: 0x8DB8FF, border_width: 3, border_color: 0x5B9BFF}
            on_click:
              - script.execute:
                  id: select_cam
                  cam: 2
            widgets:
              - label: {align: LEFT_MID, x: 18, text_font: roboto_22, text: "Birdseye"}

        # ---- Door release ----
        - button:
            x: 768
            y: 448
            width: 240
            height: 136
            bg_color: 0x35C27A
            text_color: 0x06210F
            pressed: {bg_color: 0x2AA366}
            on_long_press:
              - script.execute: door_open
            widgets:
              - label: {align: TOP_MID, y: 24, text_font: mdi_36, text: "${ic_key}"}
              - label: {id: cam_door_lbl, align: TOP_MID, y: 68, text_font: roboto_22, text: "Hold to open"}
              - label: {align: TOP_MID, y: 98, text_font: roboto_16, text: "Main entrance"}
