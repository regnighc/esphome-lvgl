# Designed for guition-esp32-p4-jc1060p470
esp32:
  variant: esp32p4
  flash_size: 16MB
  cpu_frequency: 360MHZ
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
    sdkconfig_options:
      # Route LVGL heap entirely into PSRAM
      CONFIG_LV_MEM_CUSTOM: "y"
      CONFIG_LV_MEM_ADR: "0x48000000"
      CONFIG_SPIRAM_XIP_FROM_PSRAM: "y"


# Video memory
psram:
  mode: hex
  speed: 200MHz

# Esphome
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  area: ${room}

# External components
external_components:
  - source: github://p1ngb4ck/esphome@dev
    components: [audio, binary_storage, http_file_browser, nfs_client, picture_viewer, uart, usb_host, usb_uart, usb_storage, sd_storage, smb_client, storage, transcoder, video_player, webdav_server]
    refresh: 1d
  - source: github://regnighc/esphome-onlineimage-grayscale-fix@main  #github://jtenniswood/esphome-onlineimage-grayscale-fix@main
    components: [online_image]
    refresh: 1d

http_request:
  useragent: esphome/device
  timeout: 10s
  
# Secondary ESP32-C6 device for connectivity
esp32_hosted:
  variant: esp32c6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true


# Over the Air Updates
ota:
  platform: esphome
  password: !secret ota_pw

# Enable Home Assistant API
api:
  id: ha_api
  encryption:
    key: !secret ha_api_pw
  services:
    - service: refresh_frigate_images
      then:
        - component.update: online_img_cam_1
        - component.update: online_img_cam_2

web_server:
  port: 80
  version: 3
  include_internal: true
  
# Enable logging
logger:
  level: DEBUG

# Power management
esp_ldo:
  - channel: 3
    id: dsi_phy_enable
    voltage: 2.5V
    adjustable: True
  - channel: 4
    id: sd_card_power
    voltage: 2.7V
    adjustable: True

# Backlight
output:
  - platform: ledc
    pin: GPIO23
    id: gpio_backlight_pwm

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: Display Backlight
    icon: mdi:lightbulb-on
    id: display_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
    gamma_correct: 1.0

# Touchscreen
i2c:
  - id: bus_a
    sda: GPIO07
    scl: GPIO08
    frequency: 400kHz
    scan: true


# Enable Web Server to view the stream
esp32_camera_web_server:
  - port: 8080
    mode: stream

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12
    i2s_mclk_pin: GPIO13

# --- AUDIO DEVICES ------------------------------------------------------------
switch:
  - platform: gpio
    name: Speaker Enable
    icon: "mdi:speaker"
    entity_category: config
    pin: GPIO11
    restore_mode: ALWAYS_ON

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_a

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bus_a

microphone:
  - platform: i2s_audio
    id:  box_mic
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO48
    sample_rate: 16000
    bits_per_sample: 16bit
    adc_type: external

speaker:
  - platform: i2s_audio
    id: box_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO9
    audio_dac: es8311_dac
    dac_type: external
    channel: mono
    buffer_duration: 100ms
    bits_per_sample: 16bit
    sample_rate: 48000

i2c_device:
  - id: i2cdev1
    address: 0x18
  - id: i2cdev2
    address: 0x32
  - id: i2cdev3
    address: 0x36
  - id: i2cdev4
    address: 0x40

# Touchscreen
touchscreen:
  - platform: gt911
    id: my_touchscreen
    i2c_id: bus_a
    reset_pin: GPIO22
    interrupt_pin: GPIO21
    transform:
      # CRITICAL: Disabled to match 1024x600 native landscape
      swap_xy: false
      # Mirror parameters depend on factory flex cable bonding
      mirror_x: false
      mirror_y: false
    on_touch:
      - if:
          condition:
            lvgl.is_paused:
          then:
            - lvgl.resume:
            - switch.turn_on: backlight

# Display
display:
  - platform: mipi_dsi
    id: my_display
    model: JC1060P470
    #draw_rounding: 2
    reset_pin: GPIO05
    rotation: 0 #90
    update_interval: never
    auto_clear_enabled: false


globals:
  - id: display_page
    type: int
    restore_value: false
    initial_value: '0'
  - id: page_refresh_default_s
    type: int
    restore_value: true
    initial_value: '600'
  - id: page_refresh_current_s
    type: int
    restore_value: false
    initial_value: '60'
  - id: last_page_switch_time
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: target_temp_val
    type: float
    restore_value: no
    initial_value: '20.0'

time:
  - platform: homeassistant
    id: ha_time
    
script:
  - id: change_page_to
    parameters:
      target_page: int
    then:
      - lambda: |-
          int pages_count = 1;
          int target = target_page;
          while (target < 0) target += pages_count;
          target %= pages_count;

          // Debounce: Ignore page changes within 500ms of last change
          // (adjusted for LCD display update time)
          uint32_t now = millis();
          if (now - id(last_page_switch_time) < 500) {
            ESP_LOGD("display", "Page change ignored (debounce), last switch was %d ms ago", now - id(last_page_switch_time));
            return;
          }

          if (id(display_page) != target) {
            // Set debounce time BEFORE display update (update takes ~1.6s)
            id(last_page_switch_time) = now;
            id(display_page) = target;
            id(my_display).update();
            ESP_LOGI("display", "Switched to page %d", target);
            // Restart refresh logic
            if (id(manage_run_and_sleep).is_running()) id(manage_run_and_sleep).stop();
            id(manage_run_and_sleep).execute();
          }

  - id: manage_run_and_sleep
    mode: restart
    then:
      - logger.log: "Waiting for sync..."
      - wait_until:
          condition:
            lambda: 'return id(ha_time).now().is_valid() && api_is_connected();'
          timeout: 120s
      - delay: 5s
      - lambda: |-
          int p = id(display_page);
          int interval = id(page_refresh_default_s);
          bool is_sleep_time = false;
          auto time = id(ha_time).now();
          if (time.is_valid()) {
             int hour = time.hour;
             int minute = time.minute;
             int curr_min = hour * 60 + minute;
             int start = 0;
             int end = 5;
             if (start < end) {
                 if (hour >= start && hour < end) is_sleep_time = true;
             } else if (start > end) {
                 if (hour >= start || hour < end) is_sleep_time = true;
             }

             // Visibility Logic: Find best page for current time
             int best_page = -1;
             if (best_page == -1) best_page = 0;

             // If current page is invisible OR another should be shown, switch
             if (best_page != -1 && best_page != p) {
                 ESP_LOGI("display", "Auto-switching to scheduled page %d", best_page);
                 id(change_page_to).execute(best_page);
                 return;
             }
          }
          if (!is_sleep_time) {
          }
          id(page_refresh_current_s) = interval;
      - component.update: my_display
      - delay: !lambda 'return id(page_refresh_current_s) * 1000;'
      - script.execute: manage_run_and_sleep
