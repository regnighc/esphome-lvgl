    # ==========================================================================
    # MUSIC  (Spotify / Google / Alexa speakers via HA script.kiosk_music)
    # ==========================================================================
    - id: music_page
      scrollable: false
      styles: st_page
      pad_all: 0
      on_load:
        - script.execute: {id: nav_mark, page: 5}
      widgets:
        # ---- Now playing ----
        - obj:
            x: 112
            y: 16
            width: 440
            height: 356
            styles: st_card
            scrollable: false
            widgets:
              - obj:
                  x: 20
                  y: 20
                  width: 140
                  height: 140
                  radius: 16
                  styles: st_media
                  scrollable: false
                  widgets:
                    - label: {align: CENTER, styles: st_muted, text_font: mdi_72, text: "${ic_music}"}
              - label:
                  id: mu_title
                  x: 180
                  y: 26
                  width: 240
                  height: 58
                  long_mode: DOT
                  styles: st_name
                  text: "Nothing playing"
              - label: {id: mu_artist, x: 180, y: 92, width: 240, height: 24, long_mode: DOT, styles: st_muted, text: " "}
              - label: {id: mu_where, x: 180, y: 124, width: 240, height: 22, long_mode: DOT, styles: st_muted, text_font: roboto_16, text: " "}
              - button:
                  x: 60
                  y: 196
                  width: 88
                  height: 64
                  on_click:
                    - script.execute: {id: music_cmd, command: previous, value: 0}
                  widgets:
                    - label: {align: CENTER, text_font: mdi_36, text: "${ic_prev}"}
              - button:
                  x: 176
                  y: 188
                  width: 88
                  height: 80
                  radius: 40
                  styles: st_door
                  on_click:
                    - script.execute: {id: music_cmd, command: play_pause, value: 0}
                  widgets:
                    - label: {id: mu_play_icon, align: CENTER, text_font: mdi_36, text: "${ic_play}"}
              - button:
                  x: 292
                  y: 196
                  width: 88
                  height: 64
                  on_click:
                    - script.execute: {id: music_cmd, command: next, value: 0}
                  widgets:
                    - label: {align: CENTER, text_font: mdi_36, text: "${ic_next}"}
              - label: {x: 20, y: 296, styles: st_muted, text_font: mdi_28, text: "${ic_vol_low}"}
              - slider:
                  id: mu_volume
                  x: 60
                  y: 288
                  width: 320
                  height: 44
                  min_value: 0
                  max_value: 100
                  on_release:
                    - script.execute: {id: music_cmd, command: volume, value: !lambda 'return (int) x;'}
              - label: {x: 392, y: 296, styles: st_muted, text_font: mdi_28, text: "${ic_vol_high}"}

        # ---- Speakers ----
        - obj:
            x: 568
            y: 16
            width: 440
            height: 216
            styles: st_card
            scrollable: false
            widgets:
              - label: {x: 20, y: 16, styles: st_muted, text: "Play on"}
              - button:
                  id: spk_b0
                  x: 20
                  y: 52
                  width: 196
                  height: 72
                  styles: st_cam
                  checked: {styles: st_cam_on}
                  on_click:
                    - globals.set: {id: music_speaker, value: '0'}
                    - script.execute: music_show_speaker
                    - script.execute: {id: music_cmd, command: speaker, value: 0}
                  widgets:
                    - label: {align: LEFT_MID, x: 14, text_font: mdi_28, text: "${ic_speaker}"}
                    - label: {id: spk_l0, align: LEFT_MID, x: 50, width: 136, height: 26, long_mode: DOT, text_font: roboto_20, text: "Speaker 1"}
              - button:
                  id: spk_b1
                  x: 224
                  y: 52
                  width: 196
                  height: 72
                  styles: st_cam
                  checked: {styles: st_cam_on}
                  on_click:
                    - globals.set: {id: music_speaker, value: '1'}
                    - script.execute: music_show_speaker
                    - script.execute: {id: music_cmd, command: speaker, value: 1}
                  widgets:
                    - label: {align: LEFT_MID, x: 14, text_font: mdi_28, text: "${ic_speaker}"}
                    - label: {id: spk_l1, align: LEFT_MID, x: 50, width: 136, height: 26, long_mode: DOT, text_font: roboto_20, text: "Speaker 2"}
              - button:
                  id: spk_b2
                  x: 20
                  y: 132
                  width: 196
                  height: 72
                  styles: st_cam
                  checked: {styles: st_cam_on}
                  on_click:
                    - globals.set: {id: music_speaker, value: '2'}
                    - script.execute: music_show_speaker
                    - script.execute: {id: music_cmd, command: speaker, value: 2}
                  widgets:
                    - label: {align: LEFT_MID, x: 14, text_font: mdi_28, text: "${ic_speaker}"}
                    - label: {id: spk_l2, align: LEFT_MID, x: 50, width: 136, height: 26, long_mode: DOT, text_font: roboto_20, text: "Speaker 3"}
              - button:
                  id: spk_b3
                  x: 224
                  y: 132
                  width: 196
                  height: 72
                  styles: st_cam
                  checked: {styles: st_cam_on}
                  on_click:
                    - globals.set: {id: music_speaker, value: '3'}
                    - script.execute: music_show_speaker
                    - script.execute: {id: music_cmd, command: speaker, value: 3}
                  widgets:
                    - label: {align: LEFT_MID, x: 14, text_font: mdi_28, text: "${ic_speaker}"}
                    - label: {id: spk_l3, align: LEFT_MID, x: 50, width: 136, height: 26, long_mode: DOT, text_font: roboto_20, text: "Speaker 4"}

        # ---- Status ----
        - obj:
            x: 568
            y: 248
            width: 440
            height: 124
            styles: st_card
            scrollable: false
            widgets:
              - label: {id: mu_state, x: 20, y: 22, styles: st_name, text: "Not connected"}
              - label:
                  x: 20
                  y: 58
                  width: 400
                  long_mode: WRAP
                  styles: st_muted
                  text: "Pick a speaker, then a playlist below."

