################################################################################
# Events, Travel and Music pages
#
# Each page reads ONE Home Assistant sensor with a few text attributes, defined
# in homeassistant/kiosk.yaml. Hook up the calendar, TfL and speakers there; this
# file only draws what those attributes say.
#
#   sensor.kiosk_agenda  attr events     rows "when|time|title|where", one per line
#   sensor.kiosk_tfl     state = "HH:MM" (last refresh)
#                        attr lines       20 statuses "Good Service|Minor Delays|..."
#                        attr disruptions plain text, one disruption per line
#   sensor.kiosk_music   attr title, artist, state, volume (0-100), speaker (0-3),
#                        attr speakers "A|B|C|D", playlists "a|b|c|d|e|f"
#   script.kiosk_music   called with command + value for every button on Music
################################################################################

text_sensor:
  # ---- Events ----
  - platform: homeassistant
    id: agenda_events
    entity_id: sensor.kiosk_agenda
    attribute: events
    on_value:
      - lambda: |-
          auto field = [](const std::string &s, int n) -> std::string {
            size_t a = 0;
            for (int i = 0; i < n; i++) { a = s.find('|', a); if (a == std::string::npos) return ""; a++; }
            size_t b = s.find('|', a);
            return s.substr(a, b == std::string::npos ? std::string::npos : b - a);
          };
          lv_obj_t *row[]   = {id(ev0_row), id(ev1_row), id(ev2_row), id(ev3_row), id(ev4_row), id(ev5_row)};
          lv_obj_t *when[]  = {id(ev0_when), id(ev1_when), id(ev2_when), id(ev3_when), id(ev4_when), id(ev5_when)};
          lv_obj_t *tm[]    = {id(ev0_time), id(ev1_time), id(ev2_time), id(ev3_time), id(ev4_time), id(ev5_time)};
          lv_obj_t *title[] = {id(ev0_title), id(ev1_title), id(ev2_title), id(ev3_title), id(ev4_title), id(ev5_title)};
          lv_obj_t *where[] = {id(ev0_where), id(ev1_where), id(ev2_where), id(ev3_where), id(ev4_where), id(ev5_where)};
          std::vector<std::string> rows;
          size_t a = 0;
          while (a <= x.size() && rows.size() < 6) {
            size_t b = x.find('\n', a);
            std::string r = x.substr(a, b == std::string::npos ? std::string::npos : b - a);
            if (!r.empty()) rows.push_back(r);
            if (b == std::string::npos) break;
            a = b + 1;
          }
          for (int i = 0; i < 6; i++) {
            if (i < (int) rows.size()) {
              lv_label_set_text(when[i],  field(rows[i], 0).c_str());
              lv_label_set_text(tm[i],    field(rows[i], 1).c_str());
              lv_label_set_text(title[i], field(rows[i], 2).c_str());
              lv_label_set_text(where[i], field(rows[i], 3).c_str());
              lv_obj_remove_flag(row[i], LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(row[i], LV_OBJ_FLAG_HIDDEN);
            }
          }
          if (rows.empty()) {
            lv_obj_remove_flag(id(ev_empty), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(ev_next_title), "Nothing coming up");
            lv_label_set_text(id(ev_next_time), "");
          } else {
            lv_obj_add_flag(id(ev_empty), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(ev_next_title), field(rows[0], 2).c_str());
            std::string t = field(rows[0], 0) + " " + field(rows[0], 1);
            lv_label_set_text(id(ev_next_time), t.c_str());
          }

  # ---- Travel ----
  - platform: homeassistant
    id: tfl_lines
    entity_id: sensor.kiosk_tfl
    attribute: lines
    on_value:
      - lambda: |-
          lv_obj_t *st[]  = {id(tfl_s0), id(tfl_s1), id(tfl_s2), id(tfl_s3), id(tfl_s4), id(tfl_s5), id(tfl_s6), id(tfl_s7), id(tfl_s8), id(tfl_s9), id(tfl_s10), id(tfl_s11), id(tfl_s12), id(tfl_s13), id(tfl_s14), id(tfl_s15), id(tfl_s16), id(tfl_s17), id(tfl_s18), id(tfl_s19)};
          lv_obj_t *dot[] = {id(tfl_d0), id(tfl_d1), id(tfl_d2), id(tfl_d3), id(tfl_d4), id(tfl_d5), id(tfl_d6), id(tfl_d7), id(tfl_d8), id(tfl_d9), id(tfl_d10), id(tfl_d11), id(tfl_d12), id(tfl_d13), id(tfl_d14), id(tfl_d15), id(tfl_d16), id(tfl_d17), id(tfl_d18), id(tfl_d19)};
          size_t a = 0;
          for (int i = 0; i < 20; i++) {
            std::string v;
            if (a <= x.size()) {
              size_t b = x.find('|', a);
              v = x.substr(a, b == std::string::npos ? std::string::npos : b - a);
              a = (b == std::string::npos) ? x.size() + 1 : b + 1;
            }
            uint32_t c;
            bool good = false;
            if (v.empty() || v == "unknown") { v = "No data"; c = 0x6B7280; }
            else if (v.find("Good") != std::string::npos) { c = 0x35C27A; good = true; }
            else if (v.find("Minor") != std::string::npos || v.find("Reduced") != std::string::npos ||
                     v.find("Planned") != std::string::npos || v.find("Special") != std::string::npos) c = 0xF2B53A;
            else c = 0xFF6B6B;
            lv_label_set_text(st[i], v.c_str());
            lv_obj_set_style_bg_color(dot[i], lv_color_hex(c), 0);
            // Problems are written in the status colour; good service stays muted (theme colour).
            if (good) lv_obj_remove_local_style_prop(st[i], LV_STYLE_TEXT_COLOR, 0);
            else lv_obj_set_style_text_color(st[i], lv_color_hex(c), 0);
          }
  - platform: homeassistant
    id: tfl_disruptions
    entity_id: sensor.kiosk_tfl
    attribute: disruptions
    on_value:
      - lvgl.label.update:
          id: tfl_disrupt
          text: !lambda 'return x.empty() ? std::string("No disruptions reported.") : x;'
  - platform: homeassistant
    id: tfl_updated
    entity_id: sensor.kiosk_tfl
    on_value:
      - lvgl.label.update:
          id: tfl_updated_lbl
          text: !lambda 'return "Updated " + x;'

  # ---- Music ----
  - platform: homeassistant
    id: music_title
    entity_id: sensor.kiosk_music
    attribute: title
    on_value:
      - lvgl.label.update:
          id: mu_title
          text: !lambda 'return x.empty() ? std::string("Nothing playing") : x;'
  - platform: homeassistant
    id: music_artist
    entity_id: sensor.kiosk_music
    attribute: artist
    on_value:
      - lvgl.label.update: {id: mu_artist, text: !lambda 'return x;'}
  - platform: homeassistant
    id: music_state
    entity_id: sensor.kiosk_music
    attribute: state
    on_value:
      - lvgl.label.update:
          id: mu_play_icon
          text: !lambda 'return std::string(x == "playing" ? "${ic_pause}" : "${ic_play}");'
      - lvgl.label.update:
          id: mu_state
          text: !lambda |-
            if (x == "playing") return std::string("Playing");
            if (x == "paused") return std::string("Paused");
            if (x == "idle" || x == "on") return std::string("Ready");
            if (x == "off" || x == "standby") return std::string("Speaker off");
            return std::string("Not connected");
  - platform: homeassistant
    id: music_speakers
    entity_id: sensor.kiosk_music
    attribute: speakers
    on_value:
      - lambda: |-
          lv_obj_t *lbl[] = {id(spk_l0), id(spk_l1), id(spk_l2), id(spk_l3)};
          lv_obj_t *btn[] = {id(spk_b0), id(spk_b1), id(spk_b2), id(spk_b3)};
          size_t a = 0;
          for (int i = 0; i < 4; i++) {
            std::string v;
            if (a <= x.size()) {
              size_t b = x.find('|', a);
              v = x.substr(a, b == std::string::npos ? std::string::npos : b - a);
              a = (b == std::string::npos) ? x.size() + 1 : b + 1;
            }
            lv_label_set_text(lbl[i], v.c_str());
            if (v.empty()) lv_obj_add_flag(btn[i], LV_OBJ_FLAG_HIDDEN);
            else lv_obj_remove_flag(btn[i], LV_OBJ_FLAG_HIDDEN);
          }
      - script.execute: music_show_speaker
  - platform: homeassistant
    id: music_playlists
    entity_id: sensor.kiosk_music
    attribute: playlists
    on_value:
      - lambda: |-
          lv_obj_t *lbl[] = {id(pl_l0), id(pl_l1), id(pl_l2), id(pl_l3), id(pl_l4), id(pl_l5)};
          lv_obj_t *btn[] = {id(pl_b0), id(pl_b1), id(pl_b2), id(pl_b3), id(pl_b4), id(pl_b5)};
          size_t a = 0;
          for (int i = 0; i < 6; i++) {
            std::string v;
            if (a <= x.size()) {
              size_t b = x.find('|', a);
              v = x.substr(a, b == std::string::npos ? std::string::npos : b - a);
              a = (b == std::string::npos) ? x.size() + 1 : b + 1;
            }
            lv_label_set_text(lbl[i], v.c_str());
            if (v.empty()) lv_obj_add_flag(btn[i], LV_OBJ_FLAG_HIDDEN);
            else lv_obj_remove_flag(btn[i], LV_OBJ_FLAG_HIDDEN);
          }

sensor:
  - platform: homeassistant
    id: music_volume
    entity_id: sensor.kiosk_music
    attribute: volume
    on_value:
      - if:
          condition:
            lambda: 'return !std::isnan(x);'
          then:
            - lvgl.slider.update: {id: mu_volume, value: !lambda 'return x;'}
  - platform: homeassistant
    id: music_speaker_idx
    entity_id: sensor.kiosk_music
    attribute: speaker
    on_value:
      - if:
          condition:
            lambda: 'return !std::isnan(x);'
          then:
            - globals.set: {id: music_speaker, value: !lambda 'return (int) x;'}
            - script.execute: music_show_speaker

globals:
  - id: music_speaker
    type: int
    restore_value: false
    initial_value: '0'

script:
  # Every Music control goes through one HA script (homeassistant/kiosk.yaml).
  - id: music_cmd
    parameters:
      command: string
      value: int
    then:
      - homeassistant.action:
          action: script.kiosk_music
          data_template:
            command: "{{ c }}"
            value: "{{ v }}"
          variables:
            c: !lambda 'return command;'
            v: !lambda 'return value;'
  - id: music_show_speaker
    then:
      - lambda: |-
          lv_obj_t *btn[] = {id(spk_b0), id(spk_b1), id(spk_b2), id(spk_b3)};
          lv_obj_t *lbl[] = {id(spk_l0), id(spk_l1), id(spk_l2), id(spk_l3)};
          int s = id(music_speaker);
          for (int i = 0; i < 4; i++) {
            if (i == s) lv_obj_add_state(btn[i], LV_STATE_CHECKED);
            else lv_obj_remove_state(btn[i], LV_STATE_CHECKED);
          }
          if (s >= 0 && s < 4) {
            std::string t = std::string("on ") + lv_label_get_text(lbl[s]);
            lv_label_set_text(id(mu_where), t.c_str());
          }
  - id: events_show_date
    then:
      - if:
          condition:
            lambda: 'return id(sntp_time).now().is_valid();'
          then:
            - lvgl.label.update:
                id: ev_weekday
                text: !lambda 'return id(sntp_time).now().strftime("%A");'
            - lvgl.label.update:
                id: ev_daynum
                text: !lambda 'return id(sntp_time).now().strftime("%d");'
            - lvgl.label.update:
                id: ev_month
                text: !lambda 'return id(sntp_time).now().strftime("%B %Y");'

