    # =============================================================
    # SECONDARY PAGE: TEST ENVIRONMENT
    # =============================================================
    - id: test_page
      layout:
        type: flex
        flex_flow: column
      width: 100%
      height: 100%
      bg_color: 0x101010
      pad_all: 0

      widgets:
        - obj:
            id: test_content_area
            width: 100%
            flex_grow: 1
            bg_opa: TRANSP
            border_width: 0
            layout:
              type: flex
              flex_flow: column
              flex_align_main: center
              flex_align_cross: center
            widgets:
              - label:
                  text: "Test Bed Experiments"
                  text_color: 0x00FF00
                  text_font: label_font

        - obj:
            id: nav_bar_test
            width: 100%
            height: 80
            scrollable: false 
            bg_color: 0x1A1A1A
            border_width: 1
            border_side: TOP
            pad_top: 10        # add this
            pad_bottom: 0     # add this
            pad_left: 0       # optional, for consistency
            pad_right: 0      # optional, for consistency
            border_color: 0x333333
            layout:
