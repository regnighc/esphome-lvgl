################################################################################
# Colours
################################################################################
color:
  - id: lcars_beige
    hex: "E6CC99"
  - id: lcars_blue_gray
    hex: "99B3CC"
  - id: black
    hex: "000000"
  - id: lcars_white
    hex: "FFFFFF"
  - id: lcars_orange
    hex: "ff8800"
  - id: lcars_lightblue
    hex: "6c7acc"
  - id: lcars_red
    hex: "eb4e4e"
  - id: lcars_lightorange
    hex: "ff9c00"
  - id: lcars_lavender
    hex: "cc99ff"

# LVGL User Interface Paradigm
lvgl:
  id: my_lvgl
  color_depth: 16
  # Ensure maximum buffer allocation for tearing prevention
  buffer_size: 100%
  byte_order: little_endian
  displays:
    - my_display
  touchscreens:
    - my_touchscreen

  pages:
    # =============================================================
    # ROOT PAGE: MAIN DASHBOARD
    # =============================================================
    - id: main_page
      # Enforce vertical stacking to separate content from navigation
      layout:
        type: flex
        flex_flow: column
      width: 100%
      height: 100%
      bg_color: 0x000000
      pad_all: 0

      widgets:
        # ---------------------------------------------------------
        # ZONE 1: SCROLLABLE MAIN CONTENT
        # ---------------------------------------------------------
        - obj:
            id: main_content_area
            width: 100%
            flex_grow: 1
            bg_opa: TRANSP
            border_width: 0
            pad_all: 10
            scroll_dir: VER  # Corrected from "y"
            layout: 
              type: flex
              flex_flow: row_wrap
              flex_align_main: center
              flex_align_cross: start
              
            widgets:             
              # Example Dashboard Element: Dynamic Clock
              - label:
                  id: main_clock
                  width: 320
                  text: "00:00"
                  text_color: 0xFFFFFF
                  text_align: center
                  text_font: statistics_font

              # Example Dashboard Element: Action Button
              - button:
                  id: btn_hall_on
                  width: 180
                  height: 140
                  bg_color: 0x313131
                  radius: 12
                  # Use on_click to verify intentional actuation
                  on_click:
                    - homeassistant.service:
                        service: input_button.press
                        data: { entity_id: input_button.hallway_group_on }
                  widgets:
                    - label:
                        align: center
                        text: "HALLWAY\nON"
                        text_align: center
                        text_color: 0xFFFFFF

        # ---------------------------------------------------------
        # ZONE 2: FIXED BOTTOM NAVIGATION BAR
        # ---------------------------------------------------------
        - obj:
            id: nav_bar_main
            width: 100%
            height: 100
            # CRITICAL: Prevent scroll engines from stealing touch events
            scrollable: false  
            bg_color: 0x1A1A1A
            border_width: 1
            border_side: TOP
            border_color: 0x333333
            # Distribute navigation items evenly across the width
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_evenly 
              flex_align_cross: center
            widgets:
              # Active Navigation Button
              - button:
                  width: 140
                  height: 70
                  bg_color: 0x2196F3 # Blue highlight indicates active page
                  widgets:
                    - label: 
                        text: "HOME"
                        align: center
                        text_color: 0xFFFFFF
              
              # Central Status Indicator
              - label:
                  text: "DASHBOARD ACTIVE"
                  width: 300
                  text_align: center
                  text_color: 0x888888

              # Inactive Navigation Button: Route to Next Page
              - button:
                  width: 140
                  height: 70
                  bg_color: 0x2A2A2A
                  on_click:
                    - lvgl.page.show: test_page
                  widgets:
                    - label: 
                        text: "TEST"
                        align: center
                        text_color: 0xFFFFFF

    # =============================================================
    # SECONDARY PAGE: TEST ENVIRONMENT
    # =============================================================
    - id: test_page
      layout:
        type: flex
        flex_flow: column
      width: 100%
      height: 100%
      bg_color: 0x101010
      pad_all: 0

      widgets:
        - obj:
            id: test_content_area
            width: 100%
            flex_grow: 1
            bg_opa: TRANSP
            border_width: 0
            layout:
              type: flex
              flex_flow: column
              flex_align_main: center
              flex_align_cross: center
            widgets:
              - label:
                  text: "Test Bed Experiments"
                  text_color: 0x00FF00
                  text_font: label_font

        - obj:
            id: nav_bar_test
            width: 100%
            height: 100
            scrollable: false 
            bg_color: 0x1A1A1A
            border_width: 1
            border_side: TOP
            border_color: 0x333333
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_evenly 
              flex_align_cross: center
            widgets:
              # Route Back to Main Page
              - button:
                  width: 140
                  height: 70
                  bg_color: 0x2A2A2A
                  on_click:
                    - lvgl.page.show: main_page
                  widgets:
                    - label: 
                        text: "HOME"
                        align: center
                        text_color: 0xFFFFFF
              
              - label:
                  text: "TEST ENVIRONMENT"
                  width: 300
                  text_align: center
                  text_color: 0x888888

              # Active Navigation Button
              - button:
                  width: 140
                  height: 70
                  bg_color: 0x2196F3
                  widgets:
                    - label: 
                        text: "TEST"
                        align: center
                        text_color: 0xFFFFFF
