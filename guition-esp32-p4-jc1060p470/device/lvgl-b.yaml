# Colours
################################################################################
color:
  - id: lcars_beige
    hex: "E6CC99"
  - id: lcars_blue_gray
    hex: "99B3CC"
  - id: black
    hex: "000000"
  - id: lcars_white
    hex: "FFFFFF"
  - id: lcars_orange
    hex: "ff8800"
  - id: lcars_lightblue
    hex: "6c7acc"
  - id: lcars_red
    hex: "eb4e4e"
  - id: lcars_lightorange
    hex: "ff9c00"
  - id: lcars_lavender
    hex: "cc99ff"

# LVGL User Interface Paradigm
lvgl:
  id: my_lvgl
  color_depth: 16
  # Ensure maximum buffer allocation for tearing prevention
  buffer_size: 100%
  byte_order: little_endian
  displays:
    - my_display
  touchscreens:
    - my_touchscreen

  pages:
    # =============================================================
    # ROOT PAGE: MAIN DASHBOARD (Alignment & Border Fix)
    # =============================================================
    - id: main_page
      scrollable: false
      layout:
        type: flex
        flex_flow: column
      width: 100%
      height: 100%
      bg_color: 0xFF181818
      pad_all: 0

      widgets:
        # ---------------------------------------------------------
        # ZONE 1: MAIN CONTENT AREA
        # ---------------------------------------------------------
        - obj:
            id: main_content_area
            width: 100%
            flex_grow: 1
            bg_opa: TRANSP
            border_width: 0  # FIX 1: Remove default borders
            pad_all: 10      # Clean gutter around the screen edge
            layout: 
              type: flex
              flex_flow: row
              flex_align_main: space_between
            widgets:

              # --- LEFT & MIDDLE CLUSTER (The Controls) ---
              - obj:
                  width: 720
                  height: 100%
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  layout:
                    type: flex
                    flex_flow: column
                    pad_row: 15
                  widgets:

                    # STEP 1: THE SYNCHRONIZED HEADER
                    - obj:
                        width: 100%
                        height: 140 # Explicit height to match Clock + Date
                        bg_opa: TRANSP
                        border_width: 0
                        layout:
                          type: flex
                          flex_flow: row
                          flex_align_main: space_between
                          flex_align_cross: center
                        widgets:
                          # Clock Block
                          - obj:
                              width: 350
                              bg_opa: TRANSP
                              border_width: 0
                              layout: {type: flex, flex_flow: column, flex_align_cross: center}
                              widgets:
                                - label:
                                    id: main_time
                                    text_font: time_font
                                    text_color: 0xFFFFFF
                                    text: !lambda 'auto now = id(sntp_time).now(); return now.is_valid() ? now.strftime("%H:%M").c_str() : "Syncing...";'
                                - label:
                                    id: main_date
                                    text_font: date_font
                                    text_color: 0xFFFFFF
                                    text: !lambda 'auto now = id(sntp_time).now(); return now.is_valid() ? now.strftime("%a, %b %d").c_str() : "Please wait";'
                          
                          # NEW TOP STUFF (Now height-matched to Clock)
                          - obj:
                              width: 350
                              height: 120 # Slightly shorter than the row for a "inset" look
                              bg_color: 0xFF2A2D2E
                              radius: 15
                              border_width: 0
                              widgets:
                                - label: {text: "TOP STATUS / WEATHER", align: center, text_color: 0xAAAAAA}

                    # STEP 2: THE FULL-WIDTH DIVIDER
                    - line:
                        width: 710
                        height: 3
                        points: [ {x: 0, y: 0}, {x: 710, y: 0} ]
                        line_width: 3
                        line_color: 0xFFFFFF

                    # STEP 3: THE SLIDER GRID (2x2)
                    - obj:
                        width: 100%
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        layout:
                          type: flex
                          flex_flow: row wrap # Allows 2 side-by-side, then next 2 below
                          pad_row: 15
                          pad_column: 15
                        widgets:
                          # 1. Hallway Original
                          - obj: &slider_box_style
                              width: 345
                              height: 150 # Fixed height ensures vertical alignment
                              bg_color: 0xFF2A2D2E
                              radius: 15
                              border_width: 0
                              layout: {type: flex, flex_flow: column, flex_align_cross: start, pad_all: 15}
                              widgets:
                                - slider:
                                    id: hallway_brightness_slider
                                    width: 315
                                    height: 120
                                    bg_color: 0xFF6B6B6B
                                    radius: 12
                                    indicator: {bg_color: 0xE5CA3E, radius: 12}
                                    knob: {bg_opa: TRANSP}
                                    on_release:
                                      - homeassistant.service:
                                          service: light.turn_on
                                          entity_id: light.hallway_overhead_group
                                          data: { brightness: !lambda "return (int)x;" }
                                    widgets:
                                      - label: {align: center, text: "HALLWAY LIGHTS", text_color: 0xFFFFFF}

                          # 2. Hallway New (Right side of Hallway 1)
                          - obj:
                              <<: *slider_box_style
                              widgets:
                                - slider:
                                    id: hallway_accent_slider
                                    width: 315
                                    height: 120
                                    bg_color: 0xFF6B6B6B
                                    radius: 12
                                    indicator: {bg_color: 0x3EACE5, radius: 12}
                                    knob: {bg_opa: TRANSP}
                                    on_release:
                                      - homeassistant.service:
                                          service: light.turn_on
                                          entity_id: light.hallway_accent
                                          data: { brightness: !lambda "return (int)x;" }
                                    widgets:
                                      - label: {align: center, text: "HALLWAY ACCENT", text_color: 0xFFFFFF}

                          # 3. Livingroom Original
                          - obj:
                              <<: *slider_box_style
                              widgets:
                                - slider:
                                    id: livingroom_brightness_slider
                                    width: 315
                                    height: 120
                                    bg_color: 0xFF6B6B6B
                                    radius: 12
                                    indicator: {bg_color: 0xE5CA3E, radius: 12}
                                    knob: {bg_opa: TRANSP}
                                    on_release:
                                      - homeassistant.service:
                                          service: light.turn_on
                                          entity_id: light.living_room
                                          data: { brightness: !lambda "return (int)x;" }
                                    widgets:
                                      - label: {align: center, text: "LIVING ROOM", text_color: 0xFFFFFF}

                          # 4. Livingroom New (Right side of LR 1)
                          - obj:
                              <<: *slider_box_style
                              widgets:
                                - slider:
                                    id: lr_accent_slider
                                    width: 315
                                    height: 120
                                    bg_color: 0xFF6B6B6B
                                    radius: 12
                                    indicator: {bg_color: 0x3EACE5, radius: 12}
                                    knob: {bg_opa: TRANSP}
                                    on_release:
                                      - homeassistant.service:
                                          service: light.turn_on
                                          entity_id: light.living_room_accent
                                          data: { brightness: !lambda "return (int)x;" }
                                    widgets:
                                      - label: {align: center, text: "LR ACCENT", text_color: 0xFFFFFF}

              # --- RIGHT COLUMN (Cameras) ---
              - obj:
                  width: 350
                  height: 100%
                  bg_opa: TRANSP
                  border_width: 0
                  layout: {type: flex, flex_flow: column, flex_align_cross: center, pad_row: 10}
                  widgets:
                    - image:
                        id: w_cam_1
                        width: 320
                        height: 240
                        src: online_img_cam_1
                    - image:
                        id: w_cam_2
                        width: 320
                        height: 240
                        src: online_img_cam_2

        # ---------------------------------------------------------
        # ZONE 2: FIXED BOTTOM NAV (Remains unchanged)
        # ---------------------------------------------------------

        # ---------------------------------------------------------
        # ZONE 2: FIXED BOTTOM NAVIGATION BAR
        # ---------------------------------------------------------
        - obj:
            id: nav_bar_main
            width: 100%
            height: 80
            scrollable: false
            bg_color: 0x1A1A1A
            border_width: 1
            border_side: TOP
            pad_top: 10        # add this
            pad_bottom: 0     # add this
            pad_left: 0       # optional, for consistency
            pad_right: 0      # optional, for consistency
            border_color: 0x333333
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_evenly 
              flex_align_cross: center
            widgets:
              # Home Button (Active State)
              - button:
                  width: 120
                  height: 60
                  bg_color: 0x2196F3
                  widgets:
                    - label: 
                        text: "HOME"
                        align: center
                        text_color: 0xFFFFFF
              
              # Page Title
              - label:
                  text: "MAIN DASHBOARD"
                  width: 300
                  text_align: center
                  text_color: 0xFFFFFF

              # Test Bed Button
              - button:
                  width: 120
                  height: 60
                  bg_color: 0x2A2A2A
                  on_click:
                    - lvgl.page.show: test_page
                  widgets:
                    - label: 
                        text: "TEST"
                        align: center
                        text_color: 0xFFFFFF

