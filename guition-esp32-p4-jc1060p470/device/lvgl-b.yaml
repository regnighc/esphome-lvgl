# Satisfy the image component requirement
image:
  - file: "https://groundbreakcarolinas.com/wp-content/uploads/2020/09/President-Trump-Official-Portrait-200x200-1.jpg"
    id: image_1
    type: RGB565
  - file: "https://groundbreakcarolinas.com/wp-content/uploads/2020/09/President-Trump-Official-Portrait-200x200-1.jpg"
    id: image_2
    type: RGB565


# 2. Time
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        then:
          - lvgl.label.update:
              id: big_clock_label
              text: !lambda 'return id(ha_time).now().strftime("%H:%M");'
          - lvgl.label.update:
              id: date_label
              text: !lambda 'return id(ha_time).now().strftime("%A, %B %d");'

lvgl:
  displays: my_display
  byte_order: little_endian

  top_layer:
    widgets:
      - label:
          text: "-° / -°"
          id: temperatures
          text_font: clockbar_font
          align: top_left
          x: 20
          y: 15
      - label:
          text: "--:--"
          id: display_time
          text_font: clockbar_font
          align: top_mid
          y: 15

  pages:
    - id: screen_root
      widgets:
        - tileview:
            id: main_tileview
            scrollbar_mode: "off"
            tiles:
              # --- PAGE 1: DASHBOARD ---
              - id: main_page
                column: 0
                row: 0
                bg_color: Black
                pad_top: 60
                layout:
                  type: grid
                  grid_columns: [240, 240, 500] 
                  grid_rows: [130, 130, 130, 130]
                widgets:
                  # Navigation Button (Page 1 -> 2)
                  - button:
                      align: top_right
                      x: -10
                      y: -50 
                      width: 100
                      height: 40
                      widgets:
                        - label: { text: "NEXT", align: center }
                      on_click:
                        - lambda: |-
                            auto *tv = (lv_obj_t *) id(main_tileview);
                            lv_tileview_set_tile_id(tv, 1, 0, LV_ANIM_ON);

                  # Clock & Date
                  - obj:
                      grid_cell_column_pos: 0
                      grid_cell_column_span: 2
                      grid_cell_row_pos: 0
                      bg_opa: TRANSP
                      border_width: 0
                      layout: { type: flex, flex_flow: column, flex_align_main: center }
                      widgets:
                        - label: { id: big_clock_label, text: "00:00", text_font: clockbar_font }
                        - label: { id: date_label, text: "Loading...", text_font: label_font }

                  # Original Buttons
                  - button: { id: office_scene_calls_button, grid_cell_column_pos: 0, grid_cell_row_pos: 1, height: 115, width: 230, styles: control, checkable: true }
                  - button: { id: office_scene_evening_button, grid_cell_column_pos: 1, grid_cell_row_pos: 1, height: 115, width: 230, styles: control, checkable: true }
                  - button: { id: office_scene_dimmed_button, grid_cell_column_pos: 0, grid_cell_row_pos: 2, height: 115, width: 230, styles: control, checkable: true }
                  - button: { id: office_blind_66_button, grid_cell_column_pos: 1, grid_cell_row_pos: 2, height: 115, width: 230, styles: control, checkable: true }
                  - button: { id: office_blind_33_button, grid_cell_column_pos: 0, grid_cell_row_pos: 3, height: 115, width: 230, styles: control, checkable: true }
                  - button: { id: office_aircon_button, grid_cell_column_pos: 1, grid_cell_row_pos: 3, height: 115, width: 230, styles: control, checkable: true }

                  # Images
                  - image: { id: right_image_top, grid_cell_column_pos: 2, grid_cell_row_pos: 0, grid_cell_row_span: 2, src: image_1, width: 480, height: 250, align: center }
                  - image: { id: right_image_bottom, grid_cell_column_pos: 2, grid_cell_row_pos: 2, grid_cell_row_span: 2, src: image_2, width: 480, height: 250, align: center }

              # --- PAGE 2: EXTENDED CONTROLS ---
              - id: second_page
                column: 1
                row: 0
                bg_color: Black
                pad_top: 60
                layout: { type: flex, flex_flow: row_wrap, flex_align_main: space_evenly, pad_row: 15, pad_column: 15 }
                widgets:
                  # Navigation Button (Page 2 -> 1)
                  - button:
                      align: top_right
                      x: -10
                      y: -50
                      width: 100
                      height: 40
                      widgets:
                        - label: { text: "HOME", align: center }
                      on_click:
                        - lambda: |-
                            auto *tv = (lv_obj_t *) id(main_tileview);
                            lv_tileview_set_tile_id(tv, 0, 0, LV_ANIM_ON);

                  # 20 Buttons
                  - button: { id: office_scene_features_button, height: 110, width: 180, styles: control, checkable: true }
                  - button: { id: battery_charger_button, height: 110, width: 180, styles: control, checkable: true }
                  - button: { id: storage_lights_button, height: 110, width: 180, styles: control, checkable: true }
                  - button: { id: network_rack_button, height: 110, width: 180, styles: control, checkable: true }
                  - button: { id: office_blind_open_button, height: 110, width: 180, styles: control, checkable: true }
                  - button: { id: office_blind_close_button, height: 110, width: 180, styles: control, checkable: true }
                  
                  - button:
                      id: printer_power_button
                      height: 110
                      width: 180
                      styles: control
                      checkable: true
                      widgets:
                        - label: { id: printer_power_icon, text: $printer, align: center }
                        - obj:
                            id: print_progress_container
                            hidden: true
                            align: center
                            widgets:
                              - label: { id: print_progress_label, text: "--" }

                  - button:
                      id: filament_heater_button
                      height: 110
                      width: 180
                      styles: control
                      checkable: true
                      widgets:
                        - label: { id: filament_heater_icon, text: $filament, align: center }
                        - obj:
                            id: dryer_humidity_container
                            hidden: true
                            align: center
                            widgets:
                              - label: { id: dryer_humidity_label, text: "--" }

                  - button: { id: btn_p2_9, height: 110, width: 180, styles: control }
                  - button: { id: btn_p2_10, height: 110, width: 180, styles: control }
                  - button: { id: btn_p2_11, height: 110, width: 180, styles: control }
                  - button: { id: btn_p2_12, height: 110, width: 180, styles: control }
                  - button: { id: btn_p2_13, height: 110, width: 180, styles: control }
                  - button: { id: btn_p2_14, height: 110, width: 180, styles: control }
                  - button: { id: btn_p2_15, height: 110, width: 180, styles: control }
                  - button: { id: btn_p2_16, height: 110, width: 180, styles: control }
                  - button: { id: btn_p2_17, height: 110, width: 180, styles: control }
                  - button: { id: btn_p2_18, height: 110, width: 180, styles: control }
                  - button: { id: btn_p2_19, height: 110, width: 180, styles: control }
                  - button: { id: btn_p2_20, height: 110, width: 180, styles: control }
