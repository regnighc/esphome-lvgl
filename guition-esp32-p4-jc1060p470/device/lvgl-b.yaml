psram:
online_image:
  - id: online_img_cam_1
    url: "http://192.168.2.127:5566/api/B2C4/person/snapshot.jpg"
    format: JPEG
    type: RGB565
    resize: 317x238
    update_interval: 1min
    on_download_finished:
      then:
        # Force full display redraw so LVGL re-renders the image widget
        - component.update: my_display
    on_error:
      then:
        - component.update: my_display
  - id: online_img_cam_2
    url: "http://192.168.2.127:5566/api/B2C0/person/snapshot.jpg"
    format: JPEG
    type: RGB565
    resize: 317x238
    update_interval: 1min
    on_download_finished:
      then:
        - component.update: my_display
    on_error:
      then:
        - component.update: my_display
# Add this at the top level of your file


lvgl:
  id: my_lvgl
  log_level: WARN
  bg_color: 0x101214
  displays:
    - my_display
  
  pages:
    - id: page_0
      widgets:
        # CAMERA 1
        - image:
            id: w_cam_1
            x: 663
            y: 30
            width: 317
            height: 238
            src: online_img_cam_1

        # CLOCK / DATE
        - label:
            id: main_clock
            x: 76
            y: 11
            width: 320
            height: 160
            text: !lambda |-
              auto now = id(sntp_time).now();
              if (!now.is_valid()) {
                return "Syncing...\nPlease wait";
              }
              return now.strftime("%H:%M\n%a, %b %d").c_str();
            text_color: 0xFFFFFF
            text_align: center
            text_font: statistics_font

        # SEPARATOR LINE
        - line:
            x: 35
            y: 123
            width: 301
            height: 3
            points: [ {x: 0, y: 0}, {x: 301, y: 0} ]
            line_width: 3
            line_color: 0xFFFFFF

        # CAMERA 2
        - image:
            id: w_cam_2
            x: 663
            y: 294
            width: 317
            height: 238
            src: online_img_cam_2

        # HALLWAY CONTROLS (Simplfied)
        - button:
            id: btn_hall_on
            x: 35
            y: 253
            width: 120
            height: 120
            bg_color: 0xE5B03E
            radius: 5
            on_click:
              - homeassistant.service:
                  service: input_button.press
                  data: { entity_id: input_button.hallway_group_on }
            widgets:
              - label:
                  align: center
                  text: "ON"
                  text_color: 0x000000

        - button:
            id: btn_hall_off
            x: 35
            y: 413
            width: 120
            height: 120
            bg_color: 0x404040
            radius: 5
            on_click:
              - homeassistant.service:
                  service: input_button.press
                  data: { entity_id: input_button.hallway_group_off }
            widgets:
              - label:
                  align: center
                  text: "OFF"
                  text_color: 0xFFFFFF

        - label:
            x: 35
            y: 373
            width: 120
            height: 40
            text: "Hallway"
            text_color: 0xFFFFFF
            text_align: CENTER
