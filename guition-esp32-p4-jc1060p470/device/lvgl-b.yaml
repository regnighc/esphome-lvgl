# Time component required for the clock/date to work
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        then:
          - lvgl.label.update:
              id: big_clock_label
              text: !lambda 'return id(ha_time).now().strftime("%H:%M");'
          - lvgl.label.update:
              id: date_label
              text: !lambda 'return id(ha_time).now().strftime("%A, %B %d");'

lvgl:
  displays: my_display
  byte_order: little_endian

  # Fixed Status Bar (Stays put while swiping)
  top_layer:
    widgets:
      - label:
          text: "-° / -°"
          id: temperatures
          text_font: clockbar_font
          align: top_left
          x: 20
          y: 15
          text_color: 0xFFFFFF
      - label:
          text: "--:--"
          id: display_time
          text_font: clockbar_font
          align: top_mid
          y: 15
          text_color: 0xFFFFFF

  pages:
    - id: screen_root
      widgets:
        - tileview:
            id: main_tileview
            widgets:
              # --- PAGE 1: MAIN DASHBOARD ---
              - tile:
                  id: main_page
                  bg_color: Black
                  pad_top: 60
                  pad_all: 20
                  layout:
                    type: grid
                    # Col 0 & 1 are for buttons (approx 250px), Col 2 is for images (approx 500px)
                    grid_column_dsc: [250, 250, 480] 
                    grid_row_dsc: [120, 120, 120, 120]
                  widgets:
                    # DIGITAL CLOCK & DATE (Spans top left and top mid button slots)
                    - obj:
                        grid_cell_column_pos: 0
                        grid_cell_column_span: 2
                        grid_cell_row_pos: 0
                        bg_opa: TRANSP
                        border_width: 0
                        layout:
                          type: flex
                          flex_flow: column
                          flex_align_main: center
                          flex_align_cross: start
                        widgets:
                          - label:
                              id: big_clock_label
                              text: "00:00"
                              text_font: $large_clock_font # Ensure you define a large font
                              text_color: 0xFFFFFF
                          - label:
                              id: date_label
                              text: "Loading Date..."
                              text_font: label_font
                              text_color: 0xAAAAAA

                    # REMAINING BUTTONS (Original Positions)
                    - button: { id: office_scene_calls_button, grid_cell_column_pos: 0, grid_cell_row_pos: 1, height: 110, width: 230, styles: control }
                    - button: { id: office_scene_evening_button, grid_cell_column_pos: 1, grid_cell_row_pos: 1, height: 110, width: 230, styles: control }
                    - button: { id: office_scene_dimmed_button, grid_cell_column_pos: 0, grid_cell_row_pos: 2, height: 110, width: 230, styles: control }
                    - button: { id: office_blind_66_button, grid_cell_column_pos: 1, grid_cell_row_pos: 2, height: 110, width: 230, styles: control }
                    - button: { id: office_blind_33_button, grid_cell_column_pos: 0, grid_cell_row_pos: 3, height: 110, width: 230, styles: control }
                    - button: { id: office_aircon_button, grid_cell_column_pos: 1, grid_cell_row_pos: 3, height: 110, width: 230, styles: control }

                    # RIGHT SIDE IMAGES (Stacked, 90% fill of their area)
                    - image:
                        id: right_image_top
                        grid_cell_column_pos: 2
                        grid_cell_row_pos: 0
                        grid_cell_row_span: 2
                        src: image_1
                        width: 90%
                        height: 90%
                        align: center
                    - image:
                        id: right_image_bottom
                        grid_cell_column_pos: 2
                        grid_cell_row_pos: 2
                        grid_cell_row_span: 2
                        src: image_2
                        width: 90%
                        height: 90%
                        align: center

              # --- PAGE 2: 20 BUTTONS ---
              - tile:
                  id: second_page
                  bg_color: Black
                  pad_top: 70
                  pad_all: 20
                  layout:
                    type: flex
                    flex_flow: row_wrap
                    flex_align_main: space_evenly
                    pad_row: 15
                    pad_column: 15
                  widgets:
                    # 20 Buttons Generated for a 1024 width screen
                    - button: { id: btn_2_1, height: 110, width: 180, styles: control }
                    - button: { id: btn_2_2, height: 110, width: 180, styles: control }
                    - button: { id: btn_2_3, height: 110, width: 180, styles: control }
                    - button: { id: btn_2_4, height: 110, width: 180, styles: control }
                    - button: { id: btn_2_5, height: 110, width: 180, styles: control }
                    - button: { id: btn_2_6, height: 110, width: 180, styles: control }
                    - button: { id: btn_2_7, height: 110, width: 180, styles: control }
                    - button: { id: btn_2_8, height: 110, width: 180, styles: control }
                    - button: { id: btn_2_9, height: 110, width: 180, styles: control }
                    - button: { id: btn_2_10, height: 110, width: 180, styles: control }
                    - button: { id: btn_2_11, height: 110, width: 180, styles: control }
                    - button: { id: btn_2_12, height: 110, width: 180, styles: control }
                    - button: { id: btn_2_13, height: 110, width: 180, styles: control }
                    - button: { id: btn_2_14, height: 110, width: 180, styles: control }
                    - button: { id: btn_2_15, height: 110, width: 180, styles: control }
                    - button: { id: btn_2_16, height: 110, width: 180, styles: control }
                    - button: { id: btn_2_17, height: 110, width: 180, styles: control }
                    - button: { id: btn_2_18, height: 110, width: 180, styles: control }
                    - button: { id: btn_2_19, height: 110, width: 180, styles: control }
                    - button: { id: btn_2_20, height: 110, width: 180, styles: control }
