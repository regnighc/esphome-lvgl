psram:

online_image:
  - url: "http://192.168.2.127:5566/api/B2C0/person/snapshot.jpg"
    id: online_img_cam_2
    type: RGB565
    byte_order: little_endian
    format: jpeg
    #placeholder: album_art_placeholder
    #resize: 320x240
    update_interval: 1min
    buffer_size: 131072
    on_download_finished:
      then:
        - lvgl.image.update:
            id: w_cam_2
            src: online_img_cam_2
    on_error:
      then:
        - lvgl.image.update:
            id: w_cam_2
            src: online_img_cam_2
  - url: "http://192.168.2.127:5566/api/B2C4/person/snapshot.jpg"
    id: online_img_cam_1
    type: RGB565
    byte_order: little_endian
    format: jpeg
    #placeholder: album_art_placeholder
    #resize: 320x240
    update_interval: 1min
    buffer_size: 131072
    on_download_finished:
      then:
        - lvgl.image.update:
            id: w_cam_1
            src: online_img_cam_1
    on_error:
      then:
        - lvgl.image.update:
            id: w_cam_1
            src: online_img_cam_1


################################################################################
# Colours
################################################################################
color:
  - id: lcars_beige
    hex: "E6CC99"
  - id: lcars_blue_gray
    hex: "99B3CC"
  - id: black
    hex: "000000"
  - id: lcars_white
    hex: "FFFFFF"
  - id: lcars_orange
    hex: "ff8800"
  - id: lcars_lightblue
    hex: "6c7acc"
  - id: lcars_red
    hex: "eb4e4e"
  - id: lcars_lightorange
    hex: "ff9c00"
  - id: lcars_lavender
    hex: "cc99ff"

lvgl:
  id: my_lvgl
  #color_depth: 32
  color_depth: 16
  log_level: DEBUG
  buffer_size: 100%
  #bg_color: 0x000000
  byte_order: little_endian
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  
  pages:
    - id: page_0
      widgets:
        # Root object with the background image
        - obj:
            x: 0
            y: 0
            width: 100%
            height: 100%
            bg_color: black #0x000000
            #bg_image_src: lcars_background
            #bg_image_opa: COVER
            border_width: 0
            pad_all: 0
            
      widgets:
         # CAMERA 1
         - image:
            id: w_cam_1
            x: 663
            y: 30
            width: 320
            height: 240
            src: online_img_cam_1
            antialias: true
            mode: virtual

        # CAMERA 2
        - image:
            id: w_cam_2
            x: 663
            y: 294
            width: 320
            height: 240
            src: online_img_cam_2

        # CLOCK / DATE
        - label:
            id: main_clock
            x: 76
            y: 11
            width: 320
            height: 160
            text: !lambda |-
              auto now = id(sntp_time).now();
              if (!now.is_valid()) {
                return "Syncing...\nPlease wait";
              }
              return now.strftime("%H:%M\n%a, %b %d").c_str();
            text_color: 0xFFFFFF
            text_align: center
            text_font: statistics_font

        # SEPARATOR LINE
        - line:
            x: 35
            y: 123
            width: 301
            height: 3
            points: [ {x: 0, y: 0}, {x: 301, y: 0} ]
            line_width: 3
            line_color: 0xFFFFFF

        # HALLWAY CONTROLS (Simplfied)
        - button:
            id: btn_hall_on
            x: 35
            y: 253
            width: 120
            height: 120
            bg_color: 0xE5CA3E
            radius: 12
            border_width: 2
            border_color: 0xC0A020
            shadow_width: 8
            shadow_opa: 80%
            shadow_color: 0x000000
            shadow_ofs_y: 4
            clip_corner: true
            on_click:
              - logger.log: "LVGL: Hallway ON button pressed"
              - homeassistant.service:
                  service: input_button.press
                  data: { entity_id: input_button.hallway_group_on }
            widgets:
              - label:
                  align: center
                  text: "ON"
                  text_color: 0x000000

        - button:
            id: btn_hall_off
            x: 35
            y: 413
            width: 120
            height: 120
            bg_color: 0xE5CA3E
            radius: 12
            border_width: 2
            border_color: 0xC0A020
            shadow_width: 8
            shadow_opa: 80%
            shadow_color: 0x000000
            shadow_ofs_y: 4
            clip_corner: true
            on_click:
              - logger.log: "LVGL: Hallway OFF button pressed"
              - homeassistant.service:
                  service: input_button.press
                  data: { entity_id: input_button.hallway_group_off }
            widgets:
              - label:
                  align: center
                  text: "OFF"
                  text_color: 0xFFFFFF

        - label:
            x: 35
            y: 363
            width: 120
            height: 40
            text: "Hallway"
            text_color: 0xFFFFFF
            text_align: CENTER
