lvgl:
  id: my_lvgl
  log_level: WARN
  bg_color: "0xFFFFFF"
  displays:
    - my_display
  on_idle:
    timeout: 10s
    then:
      - light.turn_off: display_backlight
      - lvgl.pause: {}
  pages:
    - id: page_0
      widgets:
        - image:
            id: w_mmb6g658riviu
            x: 663
            y: 30
            width: 317
            height: 238
            src: online_img_w_mmb6g658riviu
            angle: 0
            pivot_x: 0
            pivot_y: 0
            image_recolor: "0x000000"
            image_recolor_opa: cover
        - label:
            id: w_mmb6fn77ic33f
            x: 76
            y: 11
            width: 220
            height: 102
            text: !lambda |-
              auto now = id(ha_time).now();
              return now.strftime("%H:%M\n%a, %b %d").c_str();
            text_font: label_font
            text_color: "0x000000"
            text_align: center
            opa: cover
        - line:
            id: w_mmb6uzhkskg3l
            x: 35
            y: 123
            width: 301
            height: 3
            clickable: false
            scrollable: false
            points:
              -
                x: 0
                y: 0
              -
                x: 301
                y: 0
            line_width: 3
            line_color: "0x000000"
            line_rounded: true
            opa: cover
        - obj:
            id: w_mmb74vjr22h4z
            x: 1
            y: 126
            width: 370
            height: 90
            bg_color: "0x000000"
            bg_opa: COVER
            radius: 8
            border_width: 1
            border_color: "0x000000"
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_around
              flex_align_cross: center
            widgets:
              -
                obj:
                  width: 20%
                  height: 100%
                  bg_opa: transp
                  border_width: 0
                  widgets:
                    -
                      label:
                        align: top_mid
                        text: !lambda |-
                          if (0 == 0) return "Today";
                          auto t = id(ha_time).now();
                          if (!t.is_valid()) return "---";
                          ESPTime future = ESPTime::from_epoch_local(t.timestamp + (0 * 86400));
                          static char buf[16];
                          future.strftime(buf, sizeof(buf), "%a");
                          return buf;
                        text_font: label_font
                        text_color: "0x000000"
                    -
                      label:
                        align: center
                        y: 0
                        text: !lambda |-
                          std::string c = id(weather_cond_day0).state;
                          if (c == "clear-night") return "\U000F0594";
                          if (c == "cloudy") return "\U000F0590";
                          if (c == "exceptional") return "\U000F0026";
                          if (c == "fog") return "\U000F0591";
                          if (c == "hail") return "\U000F0592";
                          if (c == "lightning") return "\U000F0593";
                          if (c == "lightning-rainy") return "\U000F067E";
                          if (c == "partlycloudy") return "\U000F0595";
                          if (c == "pouring") return "\U000F0596";
                          if (c == "rainy") return "\U000F0597";
                          if (c == "snowy") return "\U000F0598";
                          if (c == "snowy-rainy") return "\U000F067F";
                          if (c == "sunny") return "\U000F0599";
                          if (c == "windy") return "\U000F059D";
                          if (c == "windy-variant") return "\U000F059E";
                          return "\U000F0590";
                        text_font: label_font
                        text_color: "0x000000"
                    -
                      label:
                        align: bottom_mid
                        text: !lambda "return str_sprintf('%.1f/%.1f', id(weather_high_day0).state, id(weather_low_day0).state).c_str();"
                        text_font: label_font
                        text_color: "0x000000"
