psram:

online_image:
  - url: "http://192.168.2.127:5566/api/B2C0/person/snapshot.jpg"
    id: online_img_cam_2
    type: RGB565
    byte_order: little_endian
    format: jpeg
    #placeholder: album_art_placeholder
    resize: 320x240
    update_interval: 1min
    buffer_size: 131072
    on_download_finished:
      then:
        - lvgl.image.update:
            id: w_cam_2
            src: online_img_cam_2
    on_error:
      then:
        - lvgl.image.update:
            id: w_cam_2
            src: online_img_cam_2
  - url: "http://192.168.2.127:5566/api/B2C4/person/snapshot.jpg"
    id: online_img_cam_1
    type: RGB565
    byte_order: little_endian
    format: jpeg
    #placeholder: album_art_placeholder
    resize: 320x240
    update_interval: 1min
    buffer_size: 131072
    on_download_finished:
      then:
        - lvgl.image.update:
            id: w_cam_1
            src: online_img_cam_1
    on_error:
      then:
        - lvgl.image.update:
            id: w_cam_1
            src: online_img_cam_1


################################################################################
# Colours
################################################################################
color:
  - id: lcars_beige
    hex: "E6CC99"
  - id: lcars_blue_gray
    hex: "99B3CC"
  - id: black
    hex: "000000"
  - id: lcars_white
    hex: "FFFFFF"
  - id: lcars_orange
    hex: "ff8800"
  - id: lcars_lightblue
    hex: "6c7acc"
  - id: lcars_red
    hex: "eb4e4e"
  - id: lcars_lightorange
    hex: "ff9c00"
  - id: lcars_lavender
    hex: "cc99ff"

# LVGL User Interface Paradigm
lvgl:
  id: my_lvgl
  color_depth: 16
  # Ensure maximum buffer allocation for tearing prevention
  buffer_size: 100%
  byte_order: little_endian
  displays:
    - my_display
  touchscreens:
    - my_touchscreen

  pages:
    # =============================================================
    # ROOT PAGE: MAIN DASHBOARD
    # =============================================================
    - id: main_page
      layout:
        type: flex
        flex_flow: column
      width: 100%
      height: 100%
      bg_color: 0x000000
      pad_all: 0

      widgets:
        # ---------------------------------------------------------
        # ZONE 1: SCROLLABLE MAIN CONTENT
        # ---------------------------------------------------------
        - obj:
            id: main_content_area
            width: 100%
            flex_grow: 1
            bg_opa: TRANSP
            border_width: 0
            pad_all: 5
            #scroll_dir: VER
            layout: 
              type: flex
              flex_flow: row
              flex_align_main: space_between
            widgets:

              # --- LEFT COLUMN (Clock & Buttons) ---
              - obj:
                  width: 350
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  border_width: 0
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_cross: center
                    pad_row: 15
                  widgets:
                    # CLOCK / DATE
                    - label:
                        id: main_clock
                        width: 320
                        text: !lambda |-
                          auto now = id(sntp_time).now();
                          if (!now.is_valid()) {
                            return "Syncing...\nPlease wait";
                          }
                          return now.strftime("%H:%M\n%a, %b %d").c_str();
                        text_color: 0xFFFFFF
                        text_align: center
                        text_font: statistics_font

                    # SEPARATOR LINE
                    - line:
                        width: 301
                        height: 3
                        points: [ {x: 0, y: 0}, {x: 301, y: 0} ]
                        line_width: 3
                        line_color: 0xFFFFFF

                    # HALLWAY CONTROLS CONTAINER
                    - obj:
                        width: 100%
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        # Shift down ~4x the standard 15px gap
                        pad_top: 40  
                        layout:
                          type: flex
                          flex_flow: column
                          # Left-aligns the buttons beneath the line
                          flex_align_cross: start 
                          pad_row: 15
                        widgets:
                          # HALLWAY ON BUTTON
                          - button:
                              id: btn_hall_on
                              width: 120
                              height: 120
                              bg_color: 0xE5CA3E
                              radius: 12
                              border_width: 2
                              border_color: 0xC0A020
                              shadow_width: 8
                              shadow_opa: 80%
                              shadow_color: 0x000000
                              shadow_ofs_y: 4
                              clip_corner: true
                              on_click:
                                - logger.log: "LVGL: Hallway ON button pressed"
                                - homeassistant.service:
                                    service: input_button.press
                                    data: { entity_id: input_button.hallway_group_on }
                              widgets:
                                - label:
                                    align: center
                                    text: "ON"
                                    text_color: 0x000000

                          # HALLWAY LABEL
                          - label:
                              width: 120
                              text: "Hallway"
                              text_color: 0xFFFFFF
                              text_align: center

                          # HALLWAY OFF BUTTON
                          - button:
                              id: btn_hall_off
                              width: 120
                              height: 120
                              bg_color: 0xE5CA3E
                              radius: 12
                              border_width: 2
                              border_color: 0xC0A020
                              shadow_width: 8
                              shadow_opa: 80%
                              shadow_color: 0x000000
                              shadow_ofs_y: 4
                              clip_corner: true
                              on_click:
                                - logger.log: "LVGL: Hallway OFF button pressed"
                                - homeassistant.service:
                                    service: input_button.press
                                    data: { entity_id: input_button.hallway_group_off }
                              widgets:
                                - label:
                                    align: center
                                    text: "OFF"
                                    text_color: 0xFFFFFF

              # --- RIGHT COLUMN (Cameras) ---
              - obj:
                  width: 350
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  border_width: 0
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_cross: center
                    pad_row: 10 #20
                  widgets:
                    # CAMERA 1
                    - image:
                        id: w_cam_1
                        width: 320
                        height: 240
                        src: online_img_cam_1
                        antialias: true
                        mode: virtual

                    # CAMERA 2
                    - image:
                        id: w_cam_2
                        width: 320
                        height: 240
                        src: online_img_cam_2

        # ---------------------------------------------------------
        # ZONE 2: FIXED BOTTOM NAVIGATION BAR
        # ---------------------------------------------------------
        - obj:
            id: nav_bar_main
            width: 100%
            height: 80
            scrollable: false
            bg_color: 0x1A1A1A
            border_width: 1
            border_side: TOP
            border_color: 0x333333
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_evenly 
              flex_align_cross: center
            widgets:
              # Home Button (Active State)
              - button:
                  width: 120
                  height: 60
                  bg_color: 0x2196F3
                  widgets:
                    - label: 
                        text: "HOME"
                        align: center
                        text_color: 0xFFFFFF
              
              # Page Title
              - label:
                  text: "MAIN DASHBOARD"
                  width: 300
                  text_align: center
                  text_color: 0xFFFFFF

              # Test Bed Button
              - button:
                  width: 120
                  height: 60
                  bg_color: 0x2A2A2A
                  on_click:
                    - lvgl.page.show: test_page
                  widgets:
                    - label: 
                        text: "TEST"
                        align: center
                        text_color: 0xFFFFFF

    # =============================================================
    # SECONDARY PAGE: TEST ENVIRONMENT
    # =============================================================
    - id: test_page
      layout:
        type: flex
        flex_flow: column
      width: 100%
      height: 100%
      bg_color: 0x101010
      pad_all: 0

      widgets:
        - obj:
            id: test_content_area
            width: 100%
            flex_grow: 1
            bg_opa: TRANSP
            border_width: 0
            layout:
              type: flex
              flex_flow: column
              flex_align_main: center
              flex_align_cross: center
            widgets:
              - label:
                  text: "Test Bed Experiments"
                  text_color: 0x00FF00
                  text_font: label_font

        - obj:
            id: nav_bar_test
            width: 100%
            height: 100
            scrollable: false 
            bg_color: 0x1A1A1A
            border_width: 1
            border_side: TOP
            border_color: 0x333333
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_evenly 
              flex_align_cross: center
            widgets:
              # Route Back to Main Page
              - button:
                  width: 140
                  height: 70
                  bg_color: 0x2A2A2A
                  on_click:
                    - lvgl.page.show: main_page
                  widgets:
                    - label: 
                        text: "HOME"
                        align: center
                        text_color: 0xFFFFFF
              
              - label:
                  text: "TEST ENVIRONMENT"
                  width: 300
                  text_align: center
                  text_color: 0x888888

              # Active Navigation Button
              - button:
                  width: 140
                  height: 70
                  bg_color: 0x2196F3
                  widgets:
                    - label: 
                        text: "TEST"
                        align: center
                        text_color: 0xFFFFFF
