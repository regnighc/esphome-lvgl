                        align: center
                        text_color: 0xFFFFFF


    # =========================================================================
    # FULLSCREEN CAMERA PAGES — tap anywhere returns to cameras_page
    # Image fills the full screen (no nav bar). Resize to 1024x600 for full fill.
    # =========================================================================

    - id: cam1_full_page
      scrollable: false
      width: 100%
      height: 100%
      bg_color: 0xFF000000
      pad_all: 0
      layout:
        type: flex
        flex_flow: column
        flex_align_main: center
        flex_align_cross: center
      widgets:
        - image:
            id: w_cam_1_full
            width: 100%
            height: 100%
            src: online_img_cam_1
