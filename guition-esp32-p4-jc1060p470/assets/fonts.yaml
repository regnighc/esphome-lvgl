# Fonts for the kiosk UI. One text family (Roboto) plus the dot-matrix clock face.
# Big numeric sizes only carry the glyphs they need, to keep flash use down.
substitutions:
  roboto_file: "gfonts://Roboto"
  clock_file: "gfonts://Bitcount Grid Single@300"
  light_file: "gfonts://Roboto@300"   # Aurora theme numerals

font:
  - file: ${roboto_file}
    id: roboto_16
    size: 16
    bpp: 4
    glyphsets: [GF_Latin_Core]   # accents in calendar entries and song titles
    glyphs: ["°·"]
  - file: ${roboto_file}
    id: roboto_18
    size: 18
    bpp: 4
    glyphsets: [GF_Latin_Core]   # accents in calendar entries and song titles
    glyphs: ["°·"]
  - file: ${roboto_file}
    id: roboto_20
    size: 20
    bpp: 4
    glyphsets: [GF_Latin_Core]   # accents in calendar entries and song titles
    glyphs: ["°·"]
  - file: ${roboto_file}
    id: roboto_22
    size: 22
    bpp: 4
    glyphsets: [GF_Latin_Core]   # accents in calendar entries and song titles
    glyphs: ["°·"]
  - file: ${roboto_file}
    id: roboto_44
    size: 44
    bpp: 4
    glyphs: ["0123456789:-. "]
  - file: ${roboto_file}
    id: roboto_64
    size: 64
    bpp: 4
    glyphs: ["0123456789-.° "]
  - file: ${roboto_file}
    id: roboto_76
    size: 76
    bpp: 4
    glyphs: ["0123456789-.° "]
  - file: ${clock_file}
    id: time_font
    size: 92
    bpp: 4
    glyphs: ["0123456789:- "]

  # ---- Aurora theme: light-weight numerals (digits only, so a few KB each) ----
  - file: ${light_file}
    id: clock_light
    size: 92
    bpp: 4
    glyphs: ["0123456789:- "]
  - file: ${light_file}
    id: light_64
    size: 64
    bpp: 4
    glyphs: ["0123456789-.° "]
  - file: ${light_file}
    id: light_44
    size: 44
    bpp: 4
    glyphs: ["0123456789-.° "]
