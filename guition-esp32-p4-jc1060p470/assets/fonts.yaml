# The styles below use these fonts, to change the font size, change the size here
font:
  - file: "gfonts://Roboto"
    id: statistics_font
    size: 48
    bpp: 4

  - file: "gfonts://Roboto"
    id: climate_font
    size: 100
    bpp: 4

  - file: "gfonts://Roboto"
    id: label_font
    size: 22
    bpp: 4

  - file: "gfonts://Roboto"
    id: clockbar_font
    size: 20
    bpp: 8
    
  - file: "gfonts://Bitcount Grid Single@300"
    id: time_font
    size: 72
    bpp: 4

  - file: "gfonts://Roboto"
    id: date_font
    size: 24
    bpp: 4
