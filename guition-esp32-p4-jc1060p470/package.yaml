  #lvgl: !include device/lvgl-c.yaml
  lvgl: !include device/lvgl-d.yaml   # UI v2: nav rail, Home / Lights / Cameras
  pages_extra: !include device/lvgl-pages-extra.yaml   # Events / Travel / Music
  time: !include addon/time.yaml
  backlight: !include addon/backlight.yaml
  network: !include addon/network.yaml
  fonts: !include assets/fonts.yaml
  icons: !include assets/icons.yaml
  button: !include theme/themes.yaml
